<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Predict Pro - Supabase Edition</title>
    <!-- Tailwind CSS para estilos rápidos y profesionales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #1e293b; border-radius: 0.5rem; padding: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primary { background-color: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0.25rem; transition: background 0.3s; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.25rem; }
        .text-up { color: #22c55e; }
        .text-down { color: #ef4444; }
        /* Animaciones */
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } }
        .live-indicator { width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-bold text-blue-400">BCPredict</span>
                <span class="text-xs bg-blue-900 text-blue-200 px-2 py-1 rounded">Supabase v2.0</span>
            </div>
            <div class="flex items-center gap-4">
                <div id="market-status" class="text-sm text-gray-400">Conectando...</div>
                <button onclick="toggleAuthModal()" class="btn-primary text-sm">Iniciar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Market & Prediction -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Price Card -->
            <div class="card flex justify-between items-center">
                <div>
                    <h2 class="text-gray-400 text-sm">BTC / USD</h2>
                    <div class="text-3xl font-bold mt-1" id="btc-price">Cargando...</div>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-400">Sentimiento</div>
                    <div class="font-bold text-yellow-500" id="fear-greed">Neutral</div>
                </div>
            </div>

            <!-- Chart Area -->
            <div class="card h-96 relative">
                <canvas id="priceChart"></canvas>
            </div>

            <!-- Prediction Controls -->
            <div class="card">
                <h3 class="text-xl font-bold mb-4">Hacer Predicción</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                    <select id="pred-period" class="bg-slate-700 text-white p-2 rounded border border-slate-600">
                        <option value="5m">5m (+1 pt)</option>
                        <option value="15m">15m (+2 pts)</option>
                        <option value="30m">30m (+3 pts)</option>
                        <option value="1h">1h (+4 pts)</option>
                        <option value="4h">4h (+5 pts)</option>
                        <option value="24h">24h (+8 pts)</option>
                    </select>
                </div>
                <div class="flex gap-4">
                    <button onclick="submitPrediction('sube')" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded font-bold transition">
                        SUBE 📈
                    </button>
                    <button onclick="submitPrediction('baja')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded font-bold transition">
                        BAJA 📉
                    </button>
                </div>
                <p id="pred-message" class="mt-2 text-center text-sm text-gray-400"></p>
            </div>
        </div>

        <!-- Right Column: Bots & Ranking -->
        <div class="space-y-6">
            
            <!-- Bot Control Panel -->
            <div class="card">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold">Panel de Bots</h3>
                    <span class="live-indicator"></span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="runBotEngine()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs py-2 rounded">
                        ▶ Ejecutar Motor
                    </button>
                    <button onclick="loadBots()" class="bg-slate-600 hover:bg-slate-700 text-white text-xs py-2 rounded">
                        🔄 Recargar
                    </button>
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-400">Crear Nuevo Bot</label>
                    <div class="flex gap-2 mt-1">
                        <select id="bot-personality" class="bg-slate-700 text-white text-sm p-1 rounded flex-1">
                            <option value="aggressive">Agresivo</option>
                            <option value="balanced" selected>Balanceado</option>
                            <option value="conservative">Conservador</option>
                            <option value="whale">Whale</option>
                        </select>
                        <button onclick="createBot()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 rounded">Crear</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-400">
                        <thead class="text-xs text-gray-500 uppercase bg-slate-700">
                            <tr>
                                <th class="px-2 py-2">Bot</th>
                                <th class="px-2 py-2">Win%</th>
                                <th class="px-2 py-2">Pts</th>
                                <th class="px-2 py-2">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="bots-table-body">
                            <!-- Bots loaded here -->
                            <tr><td colspan="4" class="text-center py-4">Cargando bots...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Global Stats -->
            <div class="card">
                <h3 class="text-lg font-bold mb-2">Estadísticas Globales</h3>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-slate-700 p-2 rounded">
                        <div class="text-xs text-gray-400">Predicciones Totales</div>
                        <div class="text-xl font-bold" id="global-preds">0</div>
                    </div>
                    <div class="bg-slate-700 p-2 rounded">
                        <div class="text-xs text-gray-400">Winrate Global</div>
                        <div class="text-xl font-bold text-green-400" id="global-winrate">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script>
        // ==========================================
        // CONFIGURACIÓN SUPABASE
        // ==========================================
        // REEMPLAZA ESTOS VALORES CON LOS DE TU PROYECTO SUPABASE
        
const SUPABASE_URL = 'https://smdxexgrtdpniphtnvab.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtZHhleGdydGRwbmlwaHRudmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjY0MjcsImV4cCI6MjEwMjk0MjQyN30.f7-gHQynQiI4yE9XH9k6yZA_a-x9tlo93jjq3vwQm3g';        
        //const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
        //const SUPABASE_ANON_KEY = 'TU_ANON_KEY_PUBLICA';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables Globales
        let currentPrice = 0;
        let chartInstance = null;
        let priceHistory = [];

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            startPriceFeed();
            loadBots();
            loadGlobalStats();
        });

        // ==========================================
        // PRECIOS Y GRÁFICOS
        // ==========================================
        async function startPriceFeed() {
            // Simulación de WebSocket o Polling a API pública para el gráfico
            // En producción, usa una API real o Supabase Realtime si guardas ticks
            setInterval(async () => {
                try {
                    const response = await fetch('https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT');
                    const data = await response.json();
                    const price = parseFloat(data.data[0].last);
                    updatePrice(price);
                } catch (e) {
                    console.error("Error fetching price", e);
                }
            }, 5000);
        }

        function updatePrice(price) {
            currentPrice = price;
            document.getElementById('btc-price').innerText = `$${price.toLocaleString()}`;
            document.getElementById('market-status').innerText = "Mercado Activo";
            document.getElementById('market-status').classList.add('text-green-400');

            // Update Chart
            const now = new Date().toLocaleTimeString();
            priceHistory.push({ x: now, y: price });
            if (priceHistory.length > 20) priceHistory.shift();
            
            if (chartInstance) {
                chartInstance.data.labels = priceHistory.map(p => p.x);
                chartInstance.data.datasets[0].data = priceHistory.map(p => p.y);
                chartInstance.update('none'); // Efficient update
            }
        }

        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'BTC/USD',
                        data: [],
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    animation: false
                }
            });
        }

        // ==========================================
        // LÓGICA DE PREDICCIONES (USUARIO)
        // ==========================================
        async function submitPrediction(vote) {
            const period = document.getElementById('pred-period').value;
            const msgEl = document.getElementById('pred-message');
            
            // Simulación de usuario logueado (En prod, usar supabase.auth.getUser())
            // Para demo, usamos un ID hardcodeado o generamos uno aleatorio si no hay auth
            const userId = localStorage.getItem('demo_user_id') || crypto.randomUUID();
            localStorage.setItem('demo_user_id', userId);

            if (!currentPrice) {
                msgEl.innerText = "Esperando precio...";
                return;
            }

            msgEl.innerText = "Enviando predicción...";
            
            const closesAt = new Date();
            const minutes = parseInt(period.replace('m','').replace('h','*60').replace('sem','*10080')); // Simplificado
            // Nota: La lógica de fechas exacta debe coincidir con el backend
            
            try {
                const { data, error } = await supabase
                    .from('predictions')
                    .insert([
                        {
                            user_id: userId,
                            period: period,
                            vote: vote,
                            entry_price: currentPrice,
                            status: 'activo',
                            // Calculo simple de fecha cierre para demo frontend
                            closes_at: new Date(Date.now() + (getMinutes(period) * 60000)).toISOString()
                        }
                    ])
                    .select();

                if (error) throw error;
                
                msgEl.innerText = `✅ Predicción registrada: ${vote.toUpperCase()} a $${currentPrice}`;
                msgEl.className = "mt-2 text-center text-sm text-green-400";
            } catch (err) {
                console.error(err);
                msgEl.innerText = "❌ Error al guardar predicción";
                msgEl.className = "mt-2 text-center text-sm text-red-400";
            }
        }

        function getMinutes(period) {
            if(period.includes('m')) return parseInt(period);
            if(period.includes('h')) return parseInt(period) * 60;
            if(period.includes('sem')) return 7 * 24 * 60;
            if(period.includes('mes')) return 30 * 24 * 60;
            return 5;
        }

        // ==========================================
        // GESTIÓN DE BOTS
        // ==========================================
        async function loadBots() {
            const tbody = document.getElementById('bots-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">Cargando...</td></tr>';

            try {
                // Obtener solo bots
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('is_bot', true)
                    .order('puntos', { ascending: false })
                    .limit(10);

                if (error) throw error;

                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-500">No hay bots creados</td></tr>';
                    return;
                }

                data.forEach(bot => {
                    const winrate = bot.total_votos > 0 ? ((bot.aciertos / bot.total_votos) * 100).toFixed(1) : 0;
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-slate-700 hover:bg-slate-800";
                    tr.innerHTML = `
                        <td class="px-2 py-3 font-medium text-white">${bot.username}</td>
                        <td class="px-2 py-3 ${winrate > 50 ? 'text-green-400' : 'text-red-400'}">${winrate}%</td>
                        <td class="px-2 py-3 text-blue-400">${bot.puntos}</td>
                        <td class="px-2 py-3">
                            <button onclick="toggleBot('${bot.id}', ${bot.is_active})" class="text-xs ${bot.is_active ? 'text-red-400' : 'text-green-400'} hover:underline">
                                ${bot.is_active ? 'Detener' : 'Iniciar'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Error loading bots:", err);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-red-500">Error de conexión</td></tr>';
            }
        }

        async function createBot() {
            const personality = document.getElementById('bot-personality').value;
            const uid = crypto.randomUUID();
            
            // Generar nombre aleatorio
            const names = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Omega', 'Nexus', 'Cyber'];
            const randomName = names[Math.floor(Math.random() * names.length)] + '_' + Math.floor(Math.random()*100);

            const botData = {
                id: uid,
                username: randomName,
                personality: personality,
                is_bot: true,
                is_active: true,
                skill: 0.5 + (Math.random() * 0.2), // Skill entre 0.5 y 0.7
                activity_level: 0.7
            };

            try {
                const { error } = await supabase.from('profiles').insert([botData]);
                if (error) throw error;
                loadBots(); // Recargar lista
            } catch (err) {
                alert("Error creando bot: " + err.message);
            }
        }

        async function toggleBot(id, currentState) {
            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ is_active: !currentState })
                    .eq('id', id);
                
                if (error) throw error;
                loadBots();
            } catch (err) {
                console.error(err);
            }
        }

        // ==========================================
        // MOTOR DE BOTS (LLAMADA A EDGE FUNCTION)
        // ==========================================
        async function runBotEngine() {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "⏳ Ejecutando...";
            btn.disabled = true;

            try {
                // Llamada a la Edge Function de Supabase
                const { data, error } = await supabase.functions.invoke('bot-engine');
                
                if (error) throw error;
                
                alert(`Motor ejecutado:\nPredicciones: ${data.predictionsMade}\nResultados: ${data.resultsChecked}`);
                loadBots(); // Actualizar stats
                loadGlobalStats();
                
            } catch (err) {
                console.error(err);
                alert("Error ejecutando motor: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // ==========================================
        // ESTADÍSTICAS GLOBALES
        // ==========================================
        async function loadGlobalStats() {
            try {
                // Contar predicciones totales
                const { count: totalPreds } = await supabase
                    .from('predictions')
                    .select('*', { head: true, count: 'exact' });
                
                // Contar aciertos
                const { count: totalWins } = await supabase
                    .from('predictions')
                    .select('*', { head: true, count: 'exact' })
                    .eq('result', 'acierto');

                document.getElementById('global-preds').innerText = totalPreds || 0;
                
                const winrate = totalPreds > 0 ? ((totalWins / totalPreds) * 100).toFixed(1) : 0;
                document.getElementById('global-winrate').innerText = winrate + '%';

            } catch (err) {
                console.error("Error stats:", err);
            }
        }

        function toggleAuthModal() {
            alert("Funcionalidad de Auth pendiente de implementar con Supabase Auth UI");
        }
    </script>
</body>
</html>
