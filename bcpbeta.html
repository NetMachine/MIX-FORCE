<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCPredict · Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0e17; color: #f1f5f9; font-family: system-ui, sans-serif; }
        .btn-primary { background: #f7931a; color: #000; padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
        .btn-primary:hover { background: #e8850f; }
        .glass { background: rgba(17,24,39,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(148,163,184,0.12); border-radius: 12px; padding: 20px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 12px 24px; border-radius: 10px; z-index: 999; display: none; }
        .toast.show { display: block; }
        input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 14px; border-radius: 8px; width: 100%; }
        input:focus { border-color: #f7931a; outline: none; }
    </style>
</head>
<body>

<div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center py-4 border-b border-gray-800">
        <h1 class="text-2xl font-bold text-amber-400">BCPredict</h1>
        <div id="auth-section">
            <button onclick="openLogin()" class="text-amber-400 mr-3">Iniciar Sesión</button>
            <button onclick="openRegister()" class="btn-primary">Registrarse</button>
        </div>
        <div id="user-section" class="hidden flex items-center gap-3">
            <span id="user-name" class="font-bold"></span>
            <span id="user-tier" class="text-xs bg-amber-500/20 text-amber-400 px-2 py-1 rounded"></span>
            <button onclick="logout()" class="text-red-400 text-sm">Salir</button>
        </div>
    </div>

    <!-- Precio BTC -->
    <div class="text-center my-6">
        <div class="text-5xl font-bold text-amber-400" id="btc-price">$--</div>
        <div id="btc-change" class="text-sm mt-1"></div>
    </div>

    <!-- Mensaje de estado -->
    <div id="status" class="text-center text-gray-400 text-sm mb-4"></div>

    <!-- Sección de predicción -->
    <div class="glass mb-4">
        <h2 class="text-xl font-bold mb-4">Predecir BTC</h2>
        
        <!-- Periodos -->
        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="selectPeriodo('5m')" class="period-btn p-3 rounded bg-gray-800 hover:bg-gray-700">5m</button>
            <button onclick="selectPeriodo('15m')" class="period-btn p-3 rounded bg-gray-800 hover:bg-gray-700">15m</button>
            <button onclick="selectPeriodo('1h')" class="period-btn p-3 rounded bg-gray-800 hover:bg-gray-700">1h</button>
            <button onclick="selectPeriodo('4h')" class="period-btn p-3 rounded bg-gray-800 hover:bg-gray-700">4h</button>
        </div>
        <div id="periodo-seleccionado" class="text-sm text-amber-400 mb-3 hidden">Periodo seleccionado: <span id="periodo-text"></span></div>

        <!-- Botones de voto -->
        <div id="votar-buttons" class="grid grid-cols-2 gap-4 hidden">
            <button onclick="votar('sube')" class="p-4 rounded bg-green-500/20 text-green-400 border border-green-500/30 font-bold hover:bg-green-500/30">▲ SUBE</button>
            <button onclick="votar('baja')" class="p-4 rounded bg-red-500/20 text-red-400 border border-red-500/30 font-bold hover:bg-red-500/30">▼ BAJA</button>
        </div>

        <!-- Predicción activa -->
        <div id="prediccion-activa" class="hidden mt-4 p-4 rounded bg-black/30 border border-amber-500/20">
            <div class="flex justify-between">
                <span>Tu voto: <strong id="mi-voto"></strong></span>
                <span>Tiempo: <strong id="tiempo-restante" class="text-amber-400"></strong></span>
                <span>Estado: <span class="badge-pending px-2 py-1 rounded text-xs">PENDIENTE</span></span>
            </div>
            <div class="text-xs text-gray-500 mt-2 flex justify-between">
                <span>Inicio: <span id="pred-inicio">--</span></span>
                <span>Actual: <span id="pred-actual">--</span></span>
                <span id="pred-diff">--</span>
            </div>
        </div>

        <div id="mensaje" class="text-sm text-gray-400 mt-3"></div>
    </div>

    <!-- Estadísticas -->
    <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="glass text-center"><div class="text-2xl font-bold text-amber-400" id="stats-puntos">0</div><div class="text-xs text-gray-500">Puntos</div></div>
        <div class="glass text-center"><div class="text-2xl font-bold text-green-400" id="stats-aciertos">0</div><div class="text-xs text-gray-500">Aciertos</div></div>
        <div class="glass text-center"><div class="text-2xl font-bold text-blue-400" id="stats-winrate">0%</div><div class="text-xs text-gray-500">Winrate</div></div>
    </div>

    <!-- Mis predicciones -->
    <div class="glass">
        <h3 class="font-bold mb-3">Mis Predicciones</h3>
        <div id="mis-predicciones" class="space-y-2 max-h-60 overflow-y-auto">
            <p class="text-gray-500 text-sm">Inicia sesión para ver tus predicciones</p>
        </div>
    </div>
</div>

<!-- MODAL LOGIN/REGISTER -->
<div id="modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden p-4">
    <div class="bg-gray-900 rounded-2xl p-6 max-w-md w-full border border-gray-800">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modal-title" class="text-xl font-bold">Iniciar Sesión</h2>
            <button onclick="closeModal()" class="text-gray-500 text-2xl">&times;</button>
        </div>
        <div id="login-form">
            <input type="email" id="email" placeholder="Email" class="mb-3">
            <input type="password" id="password" placeholder="Contraseña" class="mb-4">
            <button onclick="login()" class="btn-primary w-full">Entrar</button>
            <p class="text-center text-sm text-gray-500 mt-3">¿No tienes cuenta? <a href="#" onclick="switchToRegister()" class="text-amber-400">Regístrate</a></p>
        </div>
        <div id="register-form" class="hidden">
            <input type="text" id="reg-username" placeholder="Usuario" class="mb-3">
            <input type="email" id="reg-email" placeholder="Email" class="mb-3">
            <input type="password" id="reg-password" placeholder="Contraseña (mín 6)" class="mb-4">
            <button onclick="register()" class="btn-primary w-full">Crear Cuenta</button>
            <p class="text-center text-sm text-gray-500 mt-3">¿Ya tienes cuenta? <a href="#" onclick="switchToLogin()" class="text-amber-400">Inicia Sesión</a></p>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>
// ============================================================
//  SUPABASE CONFIG
// ============================================================
const SUPABASE_URL = 'https://smdxexgrtdpniphtnvab.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtZHhleGdydGRwbmlwaHRudmFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNjY0MjcsImV4cCI6MjEwMjk0MjQyN30.f7-gHQynQiI4yE9XH9k6yZA_a-x9tlo93jjq3vwQm3g';

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { autoRefreshToken: true, persistSession: true }
});

// ============================================================
//  VARIABLES
// ============================================================
let usuarioActual = null;
let periodoSeleccionado = null;
let precioBTC = 0;
let prediccionActivaId = null;
let intervaloTiempo = null;

// ============================================================
//  INICIO
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    verificarSesion();
    cargarPrecioBTC();
    setInterval(cargarPrecioBTC, 30000);
});

// ============================================================
//  PRECIO BTC
// ============================================================
async function cargarPrecioBTC() {
    try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true');
        const data = await res.json();
        if (data.bitcoin) {
            precioBTC = data.bitcoin.usd;
            document.getElementById('btc-price').textContent = '$' + precioBTC.toLocaleString();
            const change = data.bitcoin.usd_24h_change || 0;
            const changeEl = document.getElementById('btc-change');
            changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
            changeEl.className = change >= 0 ? 'text-green-400' : 'text-red-400';
        }
    } catch(e) {
        console.log('Error cargando precio:', e);
    }
}

// ============================================================
//  AUTENTICACIÓN
// ============================================================
async function verificarSesion() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
        await cargarUsuario(session.user);
    }

    supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session) {
            await cargarUsuario(session.user);
        } else if (event === 'SIGNED_OUT') {
            usuarioActual = null;
            actualizarUI();
            document.getElementById('mis-predicciones').innerHTML = '<p class="text-gray-500 text-sm">Inicia sesión para ver tus predicciones</p>';
            mostrarToast('Sesión cerrada');
        }
    });
}

async function cargarUsuario(user) {
    if (!user) return;
    
    try {
        let { data: userData, error } = await supabase
            .from('usuarios')
            .select('*')
            .eq('uid', user.id)
            .maybeSingle();

        if (!userData) {
            const username = user.user_metadata?.username || user.email.split('@')[0];
            const newUser = {
                uid: user.id,
                email: user.email,
                username: username,
                puntos: 0,
                aciertos: 0,
                total_votos: 0,
                racha: 0,
                mejor_racha: 0,
                logros: [],
                creado: new Date().toISOString()
            };
            const { error: insertError } = await supabase
                .from('usuarios')
                .upsert([newUser], { onConflict: 'uid' });
            if (insertError) throw insertError;
            usuarioActual = newUser;
        } else {
            usuarioActual = userData;
        }
        
        actualizarUI();
        cargarMisPredicciones();
        buscarPrediccionActiva();
        actualizarStats();
        
    } catch(e) {
        console.error('Error cargando usuario:', e);
        mostrarToast('Error al cargar usuario', 'error');
    }
}

async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    if (!username || !email || !password) {
        return mostrarToast('Completa todos los campos', 'error');
    }
    if (password.length < 6) {
        return mostrarToast('Contraseña mínimo 6 caracteres', 'error');
    }

    try {
        const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { username } }
        });
        if (error) throw error;

        if (data.user) {
            const newUser = {
                uid: data.user.id,
                email: email,
                username: username,
                puntos: 0,
                aciertos: 0,
                total_votos: 0,
                racha: 0,
                mejor_racha: 0,
                logros: [],
                creado: new Date().toISOString()
            };
            await supabase.from('usuarios').upsert([newUser], { onConflict: 'uid' });
            
            // Iniciar sesión automáticamente
            const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
            if (signInError) throw signInError;
            
            mostrarToast('✅ Cuenta creada correctamente');
            closeModal();
        }
    } catch(e) {
        mostrarToast('Error: ' + e.message, 'error');
    }
}

async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
        return mostrarToast('Completa todos los campos', 'error');
    }

    try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        mostrarToast('✅ Bienvenido');
        closeModal();
    } catch(e) {
        mostrarToast('Error: ' + e.message, 'error');
    }
}

async function logout() {
    await supabase.auth.signOut();
}

// ============================================================
//  UI
// ============================================================
function actualizarUI() {
    const authSection = document.getElementById('auth-section');
    const userSection = document.getElementById('user-section');

    if (usuarioActual) {
        authSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        document.getElementById('user-name').textContent = usuarioActual.username;
        const tier = getTier(usuarioActual.puntos || 0);
        document.getElementById('user-tier').textContent = tier.nombre.toUpperCase();
    } else {
        authSection.classList.remove('hidden');
        userSection.classList.add('hidden');
    }
}

function getTier(puntos) {
    if (puntos >= 1000) return { nombre: 'Maestro' };
    if (puntos >= 500) return { nombre: 'Platino' };
    if (puntos >= 200) return { nombre: 'Oro' };
    if (puntos >= 50) return { nombre: 'Plata' };
    return { nombre: 'Bronce' };
}

function actualizarStats() {
    if (!usuarioActual) {
        document.getElementById('stats-puntos').textContent = '0';
        document.getElementById('stats-aciertos').textContent = '0';
        document.getElementById('stats-winrate').textContent = '0%';
        return;
    }
    document.getElementById('stats-puntos').textContent = usuarioActual.puntos || 0;
    document.getElementById('stats-aciertos').textContent = usuarioActual.aciertos || 0;
    const total = usuarioActual.total_votos || 0;
    const aciertos = usuarioActual.aciertos || 0;
    const wr = total > 0 ? ((aciertos / total) * 100).toFixed(1) : 0;
    document.getElementById('stats-winrate').textContent = wr + '%';
}

// ============================================================
//  PREDICCIÓN
// ============================================================
function selectPeriodo(periodo) {
    if (!usuarioActual) {
        return mostrarToast('Inicia sesión para votar', 'error');
    }
    if (prediccionActivaId) {
        return mostrarToast('Ya tienes una predicción activa', 'error');
    }
    
    periodoSeleccionado = periodo;
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('bg-amber-500/20'));
    event.target.classList.add('bg-amber-500/20');
    
    document.getElementById('periodo-seleccionado').classList.remove('hidden');
    document.getElementById('periodo-text').textContent = periodo;
    document.getElementById('votar-buttons').classList.remove('hidden');
    document.getElementById('mensaje').textContent = '';
}

async function votar(direccion) {
    if (!usuarioActual) return mostrarToast('Inicia sesión', 'error');
    if (!periodoSeleccionado) return mostrarToast('Selecciona un periodo', 'error');
    if (prediccionActivaId) return mostrarToast('Ya tienes una predicción activa', 'error');

    const duraciones = { '5m': 300000, '15m': 900000, '1h': 3600000, '4h': 14400000 };
    const cierre = new Date(Date.now() + (duraciones[periodoSeleccionado] || 300000));

    try {
        const { error } = await supabase
            .from('predicciones')
            .insert([{
                usuarioId: usuarioActual.uid,
                periodo: periodoSeleccionado,
                voto: direccion,
                precioInicial: precioBTC,
                cierre: cierre.toISOString(),
                estado: 'activo',
                creado: new Date().toISOString()
            }]);
        if (error) throw error;
        
        mostrarToast('✅ Voto registrado: ' + direccion.toUpperCase());
        document.getElementById('votar-buttons').classList.add('hidden');
        buscarPrediccionActiva();
        cargarMisPredicciones();
    } catch(e) {
        mostrarToast('Error: ' + e.message, 'error');
    }
}

async function buscarPrediccionActiva() {
    if (!usuarioActual) return;
    
    try {
        const { data, error } = await supabase
            .from('predicciones')
            .select('*')
            .eq('usuarioId', usuarioActual.uid)
            .eq('estado', 'activo')
            .order('creado', { ascending: false })
            .limit(1);
        if (error) throw error;

        if (data && data.length > 0) {
            const pred = data[0];
            prediccionActivaId = pred.id;
            document.getElementById('prediccion-activa').classList.remove('hidden');
            document.getElementById('mi-voto').textContent = pred.voto.toUpperCase();
            document.getElementById('pred-inicio').textContent = '$' + (pred.precioInicial || 0).toLocaleString();
            
            if (intervaloTiempo) clearInterval(intervaloTiempo);
            intervaloTiempo = setInterval(() => {
                const diff = new Date(pred.cierre) - new Date();
                if (diff <= 0) {
                    document.getElementById('tiempo-restante').textContent = 'Finalizado';
                    clearInterval(intervaloTiempo);
                    verificarResultados();
                } else {
                    const s = Math.floor(diff/1000);
                    const m = Math.floor(s/60);
                    const h = Math.floor(m/60);
                    document.getElementById('tiempo-restante').textContent = 
                        h > 0 ? h + 'h ' + (m%60) + 'm' : m + 'm ' + (s%60) + 's';
                }
                document.getElementById('pred-actual').textContent = '$' + (precioBTC || 0).toLocaleString();
                const diffPct = precioBTC && pred.precioInicial ? 
                    (((precioBTC - pred.precioInicial) / pred.precioInicial) * 100).toFixed(2) : 0;
                document.getElementById('pred-diff').textContent = (diffPct >= 0 ? '+' : '') + diffPct + '%';
                document.getElementById('pred-diff').className = diffPct >= 0 ? 'text-green-400' : 'text-red-400';
            }, 1000);
        } else {
            document.getElementById('prediccion-activa').classList.add('hidden');
            if (intervaloTiempo) clearInterval(intervaloTiempo);
        }
    } catch(e) {
        console.error(e);
    }
}

async function verificarResultados() {
    try {
        const { data: preds, error } = await supabase
            .from('predicciones')
            .select('*')
            .eq('estado', 'activo');
        if (error) throw error;
        if (!preds) return;

        for (const pred of preds) {
            const cierre = new Date(pred.cierre);
            if (cierre > new Date()) continue;

            const precioFinal = precioBTC || pred.precioInicial;
            const subio = precioFinal > pred.precioInicial;
            const acierto = (pred.voto === 'sube' && subio) || (pred.voto === 'baja' && !subio);
            const pts = acierto ? 1 : 0;

            await supabase
                .from('predicciones')
                .update({
                    precioFinal: precioFinal,
                    estado: 'cerrado',
                    resultado: acierto ? 'acierto' : 'fallo',
                    puntosGanados: pts,
                    cerrado: new Date().toISOString()
                })
                .eq('id', pred.id);

            const { data: userData } = await supabase
                .from('usuarios')
                .select('*')
                .eq('uid', pred.usuarioId)
                .single();

            if (userData) {
                const update = {
                    total_votos: (userData.total_votos || 0) + 1
                };
                if (acierto) {
                    update.puntos = (userData.puntos || 0) + pts;
                    update.aciertos = (userData.aciertos || 0) + 1;
                    update.racha = (userData.racha || 0) + 1;
                    update.mejor_racha = Math.max(update.racha, userData.mejor_racha || 0);
                } else {
                    update.racha = 0;
                }
                await supabase
                    .from('usuarios')
                    .update(update)
                    .eq('uid', pred.usuarioId);

                if (usuarioActual && usuarioActual.uid === pred.usuarioId) {
                    usuarioActual = { ...usuarioActual, ...update };
                    actualizarStats();
                    if (acierto) {
                        mostrarToast('🎉 Acertaste! +' + pts + ' pts');
                    } else {
                        mostrarToast('❌ Fallaste');
                    }
                }
            }
        }
        buscarPrediccionActiva();
        cargarMisPredicciones();
    } catch(e) {
        console.error('Error verificando:', e);
    }
}

// ============================================================
//  MIS PREDICCIONES
// ============================================================
async function cargarMisPredicciones() {
    if (!usuarioActual) {
        document.getElementById('mis-predicciones').innerHTML = '<p class="text-gray-500 text-sm">Inicia sesión para ver tus predicciones</p>';
        return;
    }

    try {
        const { data, error } = await supabase
            .from('predicciones')
            .select('*')
            .eq('usuarioId', usuarioActual.uid)
            .order('creado', { ascending: false })
            .limit(20);
        if (error) throw error;

        const container = document.getElementById('mis-predicciones');
        if (!data || data.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-sm">No tienes predicciones</p>';
            return;
        }

        container.innerHTML = data.map(p => {
            const estado = p.estado === 'activo' ? 
                '<span class="text-yellow-400">⏳ Pendiente</span>' : 
                p.resultado === 'acierto' ? 
                '<span class="text-green-400">✅ Acierto +' + (p.puntosGanados || 0) + '</span>' : 
                '<span class="text-red-400">❌ Fallo</span>';
            return '<div class="flex justify-between items-center p-2 bg-white/5 rounded">' +
                '<span>' + p.periodo + ' <strong>' + p.voto.toUpperCase() + '</strong></span>' +
                '<span>' + estado + '</span>' +
                '</div>';
        }).join('');
    } catch(e) {
        console.error(e);
    }
}

// ============================================================
//  MODAL
// ============================================================
function openLogin() {
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal-title').textContent = 'Iniciar Sesión';
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('register-form').classList.add('hidden');
}

function openRegister() {
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('modal-title').textContent = 'Crear Cuenta';
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('register-form').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
}

function switchToRegister() {
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('register-form').classList.remove('hidden');
    document.getElementById('modal-title').textContent = 'Crear Cuenta';
}

function switchToLogin() {
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('register-form').classList.add('hidden');
    document.getElementById('modal-title').textContent = 'Iniciar Sesión';
}

// ============================================================
//  TOAST
// ============================================================
function mostrarToast(mensaje, tipo) {
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.className = 'toast ' + (tipo === 'error' ? 'bg-red-900/80' : 'bg-gray-800');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
