                'https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js'
            ];
            scripts.forEach(src => {
                const el = document.createElement('script');
                el.src = src;
                el.async = true;
                document.head.appendChild(el);
            });
        };

            if ('requestIdleCallback' in window) {
                requestIdleCallback(lazyLoadScripts);
            } else {
                setTimeout(lazyLoadScripts, 100);
            }

            // Inicializar Supabase cuando el script esté disponible
            const checkSupabase = setInterval(() => {
                if (typeof supabase !== 'undefined') {
                    clearInterval(checkSupabase);
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            }, 100);

                if (!sb) {

        // === WEBSOCKET PRECIO OPTIMIZADO ===
        function iniciarWebSocketPrecio() {
            if (state.wsPrice) { state.wsPrice.close(); state.wsPrice = null; }

            state.wsPrice = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
            let lastUpdate = 0;
            let sparklineCounter = 0;

            state.wsPrice.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const price = parseFloat(msg.p);
                state.precioAnterior = state.precioBTC;
                state.precioBTC = price;
                state.priceHistory.push(price);
                if (state.priceHistory.length > state.maxHistory) state.priceHistory.shift();

                const now = Date.now();
                if (now - lastUpdate > 100) {
                    lastUpdate = now;
                    requestAnimationFrame(() => {
                        actualizarDisplayPrecio(price);
                        sparklineCounter++;
                        if (sparklineCounter % 2 === 0) {
                            actualizarSparkline();
                        }
                        actualizarConversions(price);
                        actualizarOrderBookSim(price, parseFloat(msg.q));
                        actualizarDiferenciaPrediccion();
                    });
                }

                const simCurrent = getEl('sim-current');
                if (simCurrent && !simCurrent.value) {
                    simCurrent.value = Math.round(price);
                }

                if (state.priceHistory.length >= 10 && now - lastUpdate > 500) {
                    actualizarTendencia();
                }
            };

            state.wsPrice.onerror = (e) => console.log('WS Price Error:', e);
            state.wsPrice.onclose = () => setTimeout(iniciarWebSocketPrecio, 3000);

            const elements = state._priceElements;
            const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const fmtRaw = fmt.format(price);
            const parts = fmtRaw.split('.');
            const entero = parts[0];
            const decimal = parts[1] ? '.' + parts[1] : '';

            if (elements.heroPrice) {
                elements.heroPrice.textContent = entero;
                if (elements.heroDec) elements.heroDec.textContent = decimal;

                if (state.precioAnterior > 0) {
                    elements.heroPrice.classList.remove('price-flash-up', 'price-flash-down');

                    if (price > state.precioAnterior) {

                    } else if (price < state.precioAnterior) {
                        elements.heroPrice.classList.add('price-flash-down');
                    }
                }
            }

            if (elements.priceValue) elements.priceValue.textContent = fmtRaw;
            if (elements.priceValueMovil) elements.priceValueMovil.textContent = fmtRaw;
            if (elements.predAct) elements.predAct.textContent = fmtRaw;

        // === SPARKLINE OPTIMIZADO ===
        function actualizarSparkline() {
            if (state.priceHistory.length < 2) return;

            if (!state._sparklineElements) {
                state._sparklineElements = {
                    svg: getEl('sparkline-path'),
                    area: getEl('sparkline-area')
                };
            }

            const { svg, area } = state._sparklineElements;
            if (!svg) return;

            const min = Math.min(...state.priceHistory);
            const max = Math.max(...state.priceHistory);
            const range = max - min || 1;

            const points = state.priceHistory.map((p, i) => {
                const x = (i / (state.maxHistory - 1)) * 80;
                const y = 30 - ((p - min) / range) * 26 - 2;
                return x + ',' + y;
            }).join(' ');

            svg.setAttribute('points', points);
            if (area) {
                const areaPoints = '0,30 ' + points + ' 80,30';
                area.setAttribute('points', areaPoints);
            }

            const first = state.priceHistory[0];
            const last = state.priceHistory[state.priceHistory.length - 1];
            svg.setAttribute('stroke', last >= first ? '#22c55e' : '#ef4444');
        }

        function actualizarTendencia() {
            if (state.priceHistory.length < 10) return;
            const recent = state.priceHistory.slice(-10);
            const first = recent[0];
            const last = recent[recent.length - 1];
            const change = ((last - first) / first) * 100;
            const trendEl = getEl('market-trend');
            if (trendEl) {
                if (change > 0.5) {
                    trendEl.textContent = 'ALCISTA';
                    trendEl.className = 'text-[10px] px-2 py-0.5 rounded-md bg-green-500/10 text-green-400 font-bold border border-green-500/20';
                } else if (change < -0.5) {
                    trendEl.textContent = 'BAJISTA';
                    trendEl.className = 'text-[10px] px-2 py-0.5 rounded-md bg-red-500/10 text-red-400 font-bold border border-red-500/20';
                } else {
                    trendEl.textContent = 'LATERAL';
                    trendEl.className = 'text-[10px] px-2 py-0.5 rounded-md bg-yellow-500/10 text-yellow-400 font-bold border border-yellow-500/20';
                }
            }
        }

        function actualizarConDatosBinance(data) {
            if (!data) return;

            if (!data || !data.data) return;

            const vol = parseFloat(btc.volumeUsd24Hr) || 0;
            const change24h = parseFloat(btc.changePercent24Hr) || 0;
            const high24 = price * (1 + Math.abs(change24h) / 100);
            const low24 = price * (1 - Math.abs(change24h) / 100);
            const supply = parseFloat(btc.supply) || 0;
            const maxSupply = parseFloat(btc.maxSupply) || 21000000;
            actualizarElementosUI(price, mcap, vol, high24, low24, change24h, supply, maxSupply);

        // === UTILIDADES ===
        function fmtNum(n) {
            if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            return '$' + n.toLocaleString();
        }

        function fmtCompact(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toString();
        }

        async function cargarUsuario(user) {
            try {
                let { data: userData, error } = await sb
                    .from('usuarios')
                    .select('*')
                    .eq('uid', user.id)
                    .single();

                if (error && error.code === 'PGRST116') {
                    const username = user.user_metadata?.username || user.email.split('@')[0];
                    const { data: newUser, error: insertError } = await sb
                        .from('usuarios')
                        .insert({
                            uid: user.id,
                            email: user.email,
                            username: username,
                            puntos: 0,
                            aciertos: 0,
                            total_votos: 0,
                            racha: 0,
                            mejor_racha: 0,
                            logros: [],
                            creado: new Date().toISOString()
                        })
                        .select()
                        .single();

                    if (insertError) throw insertError;
                    userData = newUser;
                } else if (error) {
                    throw error;
                }

                state.usuarioActual = {
                    uid: user.id,
                    email: user.email,
                    username: userData.username || user.email.split('@')[0],
                    puntos: userData.puntos || 0,
                    aciertos: userData.aciertos || 0,
                    total_votos: userData.total_votos || 0,
                    racha: userData.racha || 0,
                    mejor_racha: userData.mejor_racha || 0,
                    logros: userData.logros || []
                };

                state.userAchievements = state.usuarioActual.logros;
                actualizarUI();
                cargarMisPredicciones();
                cargarRanking();
                buscarPrediccionActiva();
                actualizarStatsUsuario();
                cargarAnalisis();
                renderizarAchievements();
                verificarLogros();

                if (state.userSub) state.userSub.unsubscribe();
                state.userSub = sb
                    .channel('user-changes-' + user.id)
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'usuarios',
                        filter: 'uid=eq.' + user.id
                    }, (payload) => {
                        const newData = payload.new;
                        state.usuarioActual = { uid: user.id, ...newData };
                        state.userAchievements = newData.logros || [];
                        actualizarUI();
                        actualizarStatsUsuario();
                        renderizarAchievements();
                    })
                    .subscribe();

            } catch (e) {
                mostrarToast('Error al cargar usuario: ' + e.message, 'error');
                console.error(e);
            }
        }

        // === PREDICCION ACTIVA ===
        async function buscarPrediccionActiva() {
            if (!state.usuarioActual) return;
            try {
                const { data, error } = await sb
                    .from('predicciones')
                    .select('*')
                    .eq('usuario_id', state.usuarioActual.uid)
                    .eq('estado', 'activo')

                    if (pa) pa.classList.add('hidden');

        function mostrarPredActiva(pred) {
            const pa = getEl('prediccion-activa');
            if (pa) pa.classList.remove('hidden');
            const voto = pred.voto === 'sube' ? 'SUBE' : 'BAJA';
            const cls = pred.voto === 'sube' ? 'text-green-400' : 'text-red-400';
            const icon = pred.voto === 'sube' ? '▲' : '▼';
            const mv = getEl('mi-voto');
            if (mv) mv.innerHTML = '<span class="' + cls + '">' + icon + ' ' + voto + '</span>';
            const tr = getEl('tiempo-restante');
            if (tr) tr.textContent = calcTiempoRestante(pred.cierre);
            const ep = getEl('estado-prediccion');
            if (ep) ep.innerHTML = '<span class="px-2.5 py-1 rounded-md text-[10px] font-bold badge-pending">PENDIENTE</span>';
            const ppi = getEl('pred-precio-inicial');
            if (ppi) ppi.textContent = '$' + Math.round(pred.precio_inicial || 0).toLocaleString();
            const ppa = getEl('pred-precio-actual');
            if (ppa) ppa.textContent = state.precioBTC > 0 ? '$' + Math.round(state.precioBTC).toLocaleString() : '--';
            actualizarDiferenciaPrediccion();
        }

        function actualizarDiferenciaPrediccion() {
            const diffEl = getEl('pred-diferencia');
            if (!diffEl || !state.prediccionActivaId) return;
            const inicialEl = getEl('pred-precio-inicial');
            if (!inicialEl || inicialEl.textContent === '--') return;
            const inicial = parseFloat(inicialEl.textContent.replace(/[$,]/g, ''));
            if (!inicial || state.precioBTC === 0) return;
            const diff = ((state.precioBTC - inicial) / inicial) * 100;
            const col = diff >= 0 ? 'text-green-400' : 'text-red-400';
            const ar = diff >= 0 ? '▲' : '▼';
            diffEl.innerHTML = '<span class="' + col + '">' + ar + ' ' + Math.abs(diff).toFixed(2) + '%</span>';
        }

        function actualizarTiempoRestante(cierre) {
            const tr = getEl('tiempo-restante');
            if (tr) tr.textContent = calcTiempoRestante(cierre);
            if (new Date() >= new Date(cierre)) { clearInterval(state.intervaloTiempo); state.intervaloTiempo = null; verificarResultadosPendientes(); }
        }

        function calcTiempoRestante(cierre) {
            const diff = new Date(cierre) - new Date();
            if (diff <= 0) return 'Finalizado';
            const s = Math.floor(diff / 1000);
            const m = Math.floor(s / 60);
            const h = Math.floor(m / 60);
            const d = Math.floor(h / 24);
            if (d > 0) return d + 'd ' + (h % 24) + 'h ' + (m % 60) + 'm';
            if (h > 0) return h + 'h ' + (m % 60) + 'm ' + (s % 60) + 's';
            if (m > 0) return m + 'm ' + (s % 60) + 's';
            return s + 's';
        }

        async function votar(direccion) {
            if (!state.usuarioActual) { openModal('login'); return mostrarToast('Inicia sesion para votar', 'error'); }
            if (!state.periodoSeleccionado) return mostrarToast('Selecciona un periodo', 'error');
            if (state.prediccionActivaId) return mostrarToast('Ya tienes una prediccion activa', 'error');

            const cierre = new Date(Date.now() + DURACIONES[state.periodoSeleccionado]).toISOString();

            try {
                const { data: existing, error: checkError } = await sb
                    .from('predicciones')
                    .select('id')
                    .eq('usuario_id', state.usuarioActual.uid)
                    .eq('periodo', state.periodoSeleccionado)
                    .eq('estado', 'activo');

                if (checkError) throw checkError;
                if (existing && existing.length > 0) {
                    state.prediccionActivaId = existing[0].id;
                    return mostrarToast('Ya votaste en este periodo', 'error');
                }

                const { data, error } = await sb
                    .from('predicciones')
                    .insert({
                        usuario_id: state.usuarioActual.uid,
                        periodo: state.periodoSeleccionado,
                        voto: direccion,
                        precio_inicial: state.precioBTC,
                        cierre: cierre,
                        estado: 'activo',
                        creado: new Date().toISOString()
                    })
                    .select()
                    .single();

                if (error) throw error;

                state.prediccionActivaId = data.id;
                state.todasPrediccionesGlobal.unshift(data);

                mostrarToast('Voto registrado: ' + direccion.toUpperCase());
                const msj = getEl('mensaje');
                if (msj) msj.textContent = 'Voto registrado exitosamente';
                const bv = getEl('botones-voto');
                if (bv) bv.classList.add('hidden');

                mostrarPredActiva(data);
                if (state.intervaloTiempo) clearInterval(state.intervaloTiempo);
                state.intervaloTiempo = setInterval(() => actualizarTiempoRestante(data.cierre), 1000);

                cargarMisPredicciones();
                renderizarGlobal();
            } catch (e) {
                mostrarToast('Error al registrar voto: ' + e.message, 'error');
            }
        }

        // === VERIFICACION RESULTADOS ===
        async function verificarResultadosPendientes() {
            try {
                const { data: preds, error } = await sb
                    .from('predicciones')
                    .select('*')
                    .eq('estado', 'activo');

                if (error) throw error;
                if (!preds || preds.length === 0) return;

                let alguna = false;
                const ahora = new Date();

                for (const pred of preds) {
                    const cierre = new Date(pred.cierre);
                    if (cierre > ahora) continue;
                    alguna = true;

                    let precioFinal = state.precioBTC;
                    if (precioFinal === 0) {
                        try {
                            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                            const d = await r.json();
                            precioFinal = d.bitcoin.usd;
                        } catch (e) { precioFinal = pred.precio_inicial; }
                    }

                    const subio = precioFinal > pred.precio_inicial;
                    const acierto = (pred.voto === 'sube' && subio) || (pred.voto === 'baja' && !subio);
                    const basePts = PUNTOS_POR_PERIODO[pred.periodo] || 1;
                    const mult = MULTIPLICADORES[pred.periodo] || 1.0;
                    const pts = acierto ? Math.round(basePts * mult * state.streakMultiplier) : -Math.round(basePts * mult);

                    await sb
                        .from('predicciones')
                        .update({
                            precio_final: precioFinal,
                            estado: 'cerrado',
                            resultado: acierto ? 'acierto' : 'fallo',
                            puntos_ganados: pts,
                            cerrado: new Date().toISOString()
                        })
                        .eq('id', pred.id);

                    const { data: userData } = await sb
                        .from('usuarios')
                        .select('*')
                        .eq('uid', pred.usuario_id)
                        .single();

                    if (!userData) {
                        const { data: botData } = await sb
                            .from('bots')
                            .select('*')
                            .eq('uid', pred.usuario_id)
                            .single();

                        if (botData) {
                            await actualizarBotResultado(pred, botData, acierto, pts);
                        }
                        continue;
                    }

                    await actualizarUsuarioResultado(pred, userData, acierto, pts);

                    const { data: botData } = await sb
                        .from('bots')
                        .select('*')
                        .eq('uid', pred.usuario_id)
                        .single();

                    if (botData) {
                        await actualizarBotResultado(pred, botData, acierto, pts);
                    }

                    if (state.usuarioActual && state.usuarioActual.uid === pred.usuario_id) {
                        await actualizarUsuarioActual(pred, userData, acierto, pts, subio);
                    }

                    if (state.prediccionActivaId === pred.id) {
                        state.prediccionActivaId = null;
                        const pa = getEl('prediccion-activa');
                        if (pa) pa.classList.add('hidden');
                        const bv = getEl('botones-voto');
                        if (bv) bv.classList.remove('hidden');
                        if (state.intervaloTiempo) { clearInterval(state.intervaloTiempo); state.intervaloTiempo = null; }
                    }
                }

                if (alguna) {
                    cargarMisPredicciones();
                    cargarRanking();
                    buscarPrediccionActiva();
                    cargarAnalisis();
                    verificarLogros();
                }
            } catch (e) { console.error('Error verificando resultados:', e); }
        }

        async function actualizarUsuarioResultado(pred, userData, acierto, pts) {
            const nuevosPuntos = Math.max(0, (userData.puntos || 0) + pts);

            if (acierto) {
                const nr = (userData.racha || 0) + 1;
                const nmr = Math.max(nr, userData.mejor_racha || 0);

                await sb
                    .from('usuarios')
                    .update({
                        puntos: nuevosPuntos,
                        aciertos: (userData.aciertos || 0) + 1,
                        total_votos: (userData.total_votos || 0) + 1,
                        racha: nr,
                        mejor_racha: nmr
                    })
                    .eq('uid', pred.usuario_id);
            } else {
                await sb
                    .from('usuarios')
                    .update({
                        puntos: nuevosPuntos,
                        total_votos: (userData.total_votos || 0) + 1,
                        racha: 0
                    })
                    .eq('uid', pred.usuario_id);
            }
        }

        async function actualizarBotResultado(pred, botData, acierto, pts) {
            const nuevosPuntos = Math.max(0, (botData.puntos || 0) + pts);
            const uid = pred.usuario_id;

            if (acierto) {
                const nr = (botData.racha || 0) + 1;
                const nmr = Math.max(nr, botData.mejor_racha || 0);

                await sb
                    .from('bots')
                    .update({
                        puntos: nuevosPuntos,
                        aciertos: (botData.aciertos || 0) + 1,
                        total_votos: (botData.total_votos || 0) + 1,
                        racha: nr,
                        mejor_racha: nmr
                    })
                    .eq('uid', uid);
            } else {
                await sb
                    .from('bots')
                    .update({
                        puntos: nuevosPuntos,
                        total_votos: (botData.total_votos || 0) + 1,
                        racha: 0
                    })
                    .eq('uid', uid);
            }

            const { data: userExists } = await sb
                .from('usuarios')
                .select('uid')
                .eq('uid', uid)
                .single();

            if (userExists) {
                if (acierto) {
                    await sb
                        .from('usuarios')
                        .update({
                            puntos: nuevosPuntos,
                            aciertos: (botData.aciertos || 0) + 1,
                            total_votos: (botData.total_votos || 0) + 1,
                            racha: (botData.racha || 0) + 1,
                            mejor_racha: Math.max(botData.mejor_racha || 0, (botData.racha || 0) + 1),
                            es_bot: true
                        })
                        .eq('uid', uid);
                } else {
                    await sb
                        .from('usuarios')
                        .update({
                            puntos: nuevosPuntos,
                            total_votos: (botData.total_votos || 0) + 1,
                            racha: 0,
                            es_bot: true
                        })
                        .eq('uid', uid);
                }
            } else {
                await sb
                    .from('usuarios')
                    .insert({
                        uid: uid,
                        email: 'bot_' + uid.substr(0, 8) + '@bot.local',
                        username: botData.username || 'Bot',
                        puntos: nuevosPuntos,
                        aciertos: acierto ? 1 : 0,
                        total_votos: 1,
                        racha: acierto ? 1 : 0,
                        mejor_racha: acierto ? 1 : 0,
                        logros: [],
                        es_bot: true,
                        creado: new Date().toISOString()
                    });
            }
        }

        async function actualizarUsuarioActual(pred, userData, acierto, pts, subio) {
            const nuevosPuntos = Math.max(0, (userData.puntos || 0) + pts);

            if (acierto) {
                const nr = (userData.racha || 0) + 1;
                const nmr = Math.max(nr, userData.mejor_racha || 0);

                state.usuarioActual.puntos = nuevosPuntos;
                state.usuarioActual.aciertos = (state.usuarioActual.aciertos || 0) + 1;
                state.usuarioActual.total_votos = (state.usuarioActual.total_votos || 0) + 1;
                state.usuarioActual.racha = nr;
                state.usuarioActual.mejor_racha = nmr;

                actualizarUI();
                actualizarStatsUsuario();
                mostrarToast('✅ Acertaste! +' + pts + ' pts (x' + state.streakMultiplier + ' racha)', 'success');
                agregarNotif('+' + pts + ' pts en ' + pred.periodo + ' (racha x' + state.streakMultiplier + ')', 'success');

                if (window.confetti && state.streakMultiplier > 1) {
                    confetti({ particleCount: 50 * state.streakMultiplier, spread: 60, origin: { y: 0.7 }, colors: ['#f7931a', '#22c55e', '#FFD700', '#8A2BE2'] });
                }
            } else {
                const perdida = Math.abs(pts);
                state.usuarioActual.puntos = nuevosPuntos;
                state.usuarioActual.total_votos = (state.usuarioActual.total_votos || 0) + 1;
                state.usuarioActual.racha = 0;

                actualizarUI();
                actualizarStatsUsuario();

                if (perdida > 0) {
                    mostrarToast('❌ Fallaste. BTC ' + (subio ? 'subió' : 'bajó') + ' -' + perdida + ' pts', 'error');
                    agregarNotif('-' + perdida + ' pts en ' + pred.periodo + ' (fallo)', 'error');
                } else {
                    mostrarToast('❌ Fallaste. BTC ' + (subio ? 'subió' : 'bajó'), 'error');
                    agregarNotif('Fallo en ' + pred.periodo, 'error');
                }

                if (window.confetti && perdida >= 5) {
                    confetti({ particleCount: 30, spread: 40, origin: { y: 0.7 }, colors: ['#ef4444', '#dc2626', '#b91c1c'] });
                }
            }
        }

        function iniciarContadoresGlobales() {
            if (state._globalCounterInterval) cancelAnimationFrame(state._globalCounterInterval);

                if (timestamp - lastUpdate > 1000) {
                    lastUpdate = timestamp;
                    actualizarContadoresGlobales();
                    actualizarContadorMisPredicciones();
                }
                state._globalCounterInterval = requestAnimationFrame(updateCounters);

            state._globalCounterInterval = requestAnimationFrame(updateCounters);

        // === RANKING ===
        async function cargarRanking() {
            try {
                const { data: usuarios, error: userError } = await sb
                    .from('usuarios')
                    .select('*')
                    .order('puntos', { ascending: false })
                    .limit(50);

                if (userError) throw userError;

                const { data: bots, error: botError } = await sb
                    .from('bots')
                    .select('*')
                    .order('puntos', { ascending: false })
                    .limit(50);

                if (botError) throw botError;

                let todos = [];
                const usuariosMap = new Map();

                if (usuarios && usuarios.length > 0) {
                    for (const u of usuarios) {
                        const userUid = u.uid;
                        usuariosMap.set(userUid, true);
                        todos.push({
                            uid: userUid,
                            username: u.username || 'Anonimo',
                            puntos: u.puntos || 0,
                            aciertos: u.aciertos || 0,
                            total_votos: u.total_votos || 0,
                            racha: u.racha || 0,
                            mejor_racha: u.mejor_racha || 0,
                            es_bot: u.es_bot || false,
                            email: u.email || ''
                        });
                    }
                }

                if (bots && bots.length > 0) {
                    for (const bot of bots) {
                        const botUid = bot.uid;
                        if (!usuariosMap.has(botUid)) {
                            todos.push({
                                uid: botUid,
                                username: bot.username,
                                puntos: bot.puntos || 0,
                                aciertos: bot.aciertos || 0,
                                total_votos: bot.total_votos || 0,
                                racha: bot.racha || 0,
                                mejor_racha: bot.mejor_racha || 0,
                                es_bot: true,
                                email: 'bot@local'
                            });
                        }
                    }
                }

                todos.sort((a, b) => (b.puntos || 0) - (a.puntos || 0));
                todos = todos.slice(0, 50);

                const tbody = getEl('ranking-body');
                if (!tbody) return;

                if (!todos || todos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-gray-600">Sin usuarios registrados</td></tr>';
                    return;
                }

                let miPos = -1;
                todos.forEach((u, i) => {
                    if (state.usuarioActual && u.uid === state.usuarioActual.uid) miPos = i + 1;
                });

                tbody.innerHTML = todos.map((u, i) => {
                    const tier = getTier(u.puntos || 0);
                    const wr = u.total_votos ? ((u.aciertos / u.total_votos) * 100).toFixed(1) : 0;
                    const esYo = state.usuarioActual && u.uid === state.usuarioActual.uid;
                    const esBot = u.es_bot || false;
                    const racha = u.racha || 0;
                    const rachaIcon = racha >= 5 ? '🔥' : racha >= 3 ? '⚡' : '';
                    let rank = '';
                    if (i === 0) rank = '🥇';
                    else if (i === 1) rank = '🥈';

        // === ANALISIS ===
        async function cargarAnalisis() {
            try {
                const { data: preds, error } = await sb
                    .from('predicciones')
                    .select('*');

                if (error) throw error;
                const total = preds ? preds.length : 0;
                const activas = preds ? preds.filter(p => p.estado === 'activo').length : 0;
                const cerradas = preds ? preds.filter(p => p.estado === 'cerrado') : [];
                const aciertos = cerradas.filter(p => p.resultado === 'acierto').length;
                const wrGlobal = cerradas.length > 0 ? ((aciertos / cerradas.length) * 100).toFixed(1) : 0;
                const usuariosUnicos = new Set(preds ? preds.map(p => p.usuario_id) : []).size;

                const at = getEl('anal-total'); if (at) at.textContent = total;
                const aw = getEl('anal-winrate'); if (aw) aw.textContent = wrGlobal + '%';
                const aa = getEl('anal-activas'); if (aa) aa.textContent = activas;
                const au = getEl('anal-usuarios'); if (au) au.textContent = usuariosUnicos;

                const subidas = preds ? preds.filter(p => p.voto === 'sube').length : 0;
                const bajadas = preds ? preds.filter(p => p.voto === 'baja').length : 0;
                const totalV = subidas + bajadas;
                if (totalV > 0) {
                    const ps = ((subidas / totalV) * 100).toFixed(1);
                    const pb = ((bajadas / totalV) * 100).toFixed(1);
                    const dsb = getEl('dist-sube-bar'); if (dsb) dsb.style.width = ps + '%';
                    const dsp = getEl('dist-sube-pct'); if (dsp) dsp.textContent = ps + '%';
                    const dbb = getEl('dist-baja-bar'); if (dbb) dbb.style.width = pb + '%';
                    const dbp = getEl('dist-baja-pct'); if (dbp) dbp.textContent = pb + '%';
                }

                const periodosStats = {};
                cerradas.forEach(p => {
                    if (!periodosStats[p.periodo]) periodosStats[p.periodo] = { total: 0, aciertos: 0 };
                    periodosStats[p.periodo].total++;
                    if (p.resultado === 'acierto') periodosStats[p.periodo].aciertos++;
                });
                const mejores = Object.entries(periodosStats).map(([periodo, s]) => ({
                    periodo, winrate: s.total > 0 ? ((s.aciertos / s.total) * 100).toFixed(1) : 0, total: s.total
                })).sort((a, b) => parseFloat(b.winrate) - parseFloat(a.winrate)).slice(0, 5);

                const mp = getEl('mejores-periodos');
                if (mp) {
                    mp.innerHTML = mejores.length > 0 ? mejores.map(p =>
                        '<div class="flex justify-between items-center text-sm"><span class="text-gray-500">' + p.periodo + '</span><span class="font-bold font-mono ' + (p.winrate >= 50 ? 'text-green-400' : 'text-red-400') + '">' + p.winrate + '% <span class="text-gray-600 text-xs">(' + p.total + ')</span></span></div>'
                    ).join('') : '<p class="text-gray-600 text-sm">Sin datos suficientes</p>';
                }

                const ultimos = cerradas.sort((a, b) => new Date(b.cerrado || b.creado) - new Date(a.cerrado || a.creado)).slice(0, 10);
                const ur = getEl('ultimos-resultados');
                if (ur) {
                    ur.innerHTML = ultimos.length > 0 ? ultimos.map(p => {
                        const esA = p.resultado === 'acierto';
                        return '<div class="flex justify-between items-center text-xs p-2.5 rounded-lg ' + (esA ? 'bg-green-500/5 border border-green-500/10' : 'bg-red-500/5 border border-red-500/10') + '">' +
                            '<span class="text-gray-400">' + p.periodo + ' - ' + (p.voto === 'sube' ? '▲' : '▼') + '</span>' +
                            '<span class="' + (esA ? 'text-green-400' : 'text-red-400') + ' font-bold font-mono">' + (esA ? '+' + (p.puntos_ganados || 1) : 'FALLO') + '</span>' +
                            '</div>';
                    }).join('') : '<p class="text-gray-600 text-sm">Sin resultados aun</p>';
                }
            } catch (e) { console.error('Error cargando analisis:', e); }
        }

        function calcularProgresoLogro(ach) {
            if (!state.usuarioActual) return 0;
            switch (ach.id) {
                case 'first_win': return Math.min(100, ((state.usuarioActual.aciertos || 0) / 1) * 100);
                case 'streak_3': return Math.min(100, ((state.usuarioActual.racha || 0) / 3) * 100);
                case 'streak_5': return Math.min(100, ((state.usuarioActual.racha || 0) / 5) * 100);
                case 'streak_10': return Math.min(100, ((state.usuarioActual.racha || 0) / 10) * 100);
                case 'points_50': return Math.min(100, ((state.usuarioActual.puntos || 0) / 50) * 100);
                case 'points_200': return Math.min(100, ((state.usuarioActual.puntos || 0) / 200) * 100);
                case 'points_500': return Math.min(100, ((state.usuarioActual.puntos || 0) / 500) * 100);
                case 'points_1000': return Math.min(100, ((state.usuarioActual.puntos || 0) / 1000) * 100);
                case 'total_10': return Math.min(100, ((state.usuarioActual.total_votos || 0) / 10) * 100);
                case 'total_50': return Math.min(100, ((state.usuarioActual.total_votos || 0) / 50) * 100);
                case 'winrate_60':
                    if ((state.usuarioActual.total_votos || 0) < 10) return Math.min(100, ((state.usuarioActual.total_votos || 0) / 10) * 100);
                    return Math.min(100, (((state.usuarioActual.aciertos / state.usuarioActual.total_votos) * 100) / 60) * 100);
                case 'winrate_75':
                    if ((state.usuarioActual.total_votos || 0) < 20) return Math.min(100, ((state.usuarioActual.total_votos || 0) / 20) * 100);
                    return Math.min(100, (((state.usuarioActual.aciertos / state.usuarioActual.total_votos) * 100) / 75) * 100);
                default: return 0;
            }
        }

        async function verificarLogros() {
            if (!state.usuarioActual) return;
            const nuevos = [];
            for (const ach of ACHIEVEMENTS) {
                if (!state.userAchievements.includes(ach.id) && ach.cond(state.usuarioActual)) {
                    nuevos.push(ach);
                }

            if (nuevos.length > 0) {
                const nuevosIds = nuevos.map(a => a.id);
                state.userAchievements = [...state.userAchievements, ...nuevosIds];
                const ptsExtra = nuevos.reduce((s, a) => s + a.pts, 0);

                await sb
                    .from('usuarios')
                    .update({
                        logros: state.userAchievements,
                        puntos: (state.usuarioActual.puntos || 0) + ptsExtra
                    })
                    .eq('uid', state.usuarioActual.uid);

                state.usuarioActual.puntos = (state.usuarioActual.puntos || 0) + ptsExtra;
                state.usuarioActual.logros = state.userAchievements;

                if (window.confetti) {

                    agregarNotif('Logro: ' + a.nombre + ' +' + a.pts + ' pts', 'success');
                });
                renderizarAchievements();
            }
        }

        // === ORDER BOOK ===
        let orderBookData = { bids: [], asks: [] };

        function actualizarOrderBookSim(price, qty) {
            const spread = price * 0.0005;
            const levels = 12;
            orderBookData.bids = [];
            orderBookData.asks = [];
            for (let i = 0; i < levels; i++) {
                const bidPrice = price - spread - (i * price * 0.0002);
                const askPrice = price + spread + (i * price * 0.0002);
                const bidQty = (Math.random() * 5 + 0.1) * (1 - i * 0.08);
                const askQty = (Math.random() * 5 + 0.1) * (1 - i * 0.08);
                orderBookData.bids.push({ price: bidPrice, qty: Math.max(0.01, bidQty) });
                orderBookData.asks.push({ price: askPrice, qty: Math.max(0.01, askQty) });
            }
            renderizarOrderBook();
        }

        function renderizarOrderBook() {
            const bidsContainer = getEl('orderbook-bids');
            const asksContainer = getEl('orderbook-asks');
            if (!bidsContainer || !asksContainer) return;
            const maxBidQty = Math.max(...orderBookData.bids.map(b => b.qty));
            const maxAskQty = Math.max(...orderBookData.asks.map(a => a.qty));
            const totalBids = orderBookData.bids.reduce((s, b) => s + b.qty, 0);
            const totalAsks = orderBookData.asks.reduce((s, a) => s + a.qty, 0);

            bidsContainer.innerHTML = orderBookData.bids.map(b => {
                const pct = (b.qty / maxBidQty) * 100;
                return '<div class="order-row"><div class="bar bg-green-500" style="width:' + pct + '%;right:0;"></div><div class="content"><span class="text-green-400 font-mono">' + b.price.toFixed(2) + '</span><span class="text-gray-500 font-mono">' + b.qty.toFixed(4) + '</span></div></div>';
            }).join('');

            asksContainer.innerHTML = orderBookData.asks.map(a => {
                const pct = (a.qty / maxAskQty) * 100;
                return '<div class="order-row"><div class="bar bg-red-500" style="width:' + pct + '%;left:0;"></div><div class="content"><span class="text-red-400 font-mono">' + a.price.toFixed(2) + '</span><span class="text-gray-500 font-mono">' + a.qty.toFixed(4) + '</span></div></div>';
            }).join('');

            const bidTotal = getEl('bid-total');
            if (bidTotal) bidTotal.textContent = totalBids.toFixed(2) + ' BTC';
            const askTotal = getEl('ask-total');
            if (askTotal) askTotal.textContent = totalAsks.toFixed(2) + ' BTC';

            const spreadEl = getEl('orderbook-spread');
            if (spreadEl && orderBookData.asks[0] && orderBookData.bids[0]) {
                const spread = orderBookData.asks[0].price - orderBookData.bids[0].price;
                const spreadPct = (spread / state.precioBTC * 100).toFixed(3);
                spreadEl.textContent = '$' + spread.toFixed(2) + ' (' + spreadPct + '%)';
            }

            const ratioEl = getEl('orderbook-ratio');
            if (ratioEl) {
                const ratio = totalBids / (totalAsks || 1);
                ratioEl.textContent = ratio.toFixed(2);
                ratioEl.className = 'text-lg font-bold font-mono ' + (ratio > 1 ? 'text-green-400' : 'text-red-400');
            }

            const buyPressure = totalBids / (totalBids + totalAsks) * 100;
            const bpBar = getEl('buy-pressure-bar');
            const bpPct = getEl('buy-pressure-pct');
            if (bpBar) bpBar.style.width = buyPressure + '%';
            if (bpPct) bpPct.textContent = buyPressure.toFixed(1) + '%';

            renderizarLiquidationHeatmap();
        }

        function renderizarLiquidationHeatmap() {
            const container = getEl('liquidation-heatmap');
            if (!container || !state.precioBTC) return;
            const steps = 5;
            const range = state.precioBTC * 0.15;
            const cells = [];
            for (let i = 0; i < steps * 5; i++) {
                const priceLevel = state.precioBTC - range + (i / (steps * 5 - 1)) * range * 2;
                const dist = Math.abs(priceLevel - state.precioBTC) / state.precioBTC;
                const intensity = Math.max(0, 1 - dist * 5);
                let bg, text;
                if (priceLevel < state.precioBTC) {
                    bg = 'rgba(34,197,94,' + (intensity * 0.6 + 0.1) + ')';
                    text = '#4ade80';
                } else {
                    bg = 'rgba(239,68,68,' + (intensity * 0.6 + 0.1) + ')';
                    text = '#f87171';
                }
                const isCurrent = Math.abs(priceLevel - state.precioBTC) < state.precioBTC * 0.005;
                cells.push('<div class="heatmap-cell" style="background:' + bg + ';color:' + text + ';' + (isCurrent ? 'border:2px solid #f7931a;box-shadow:0 0 10px rgba(247,147,26,0.3);' : '') + '">' + (priceLevel / 1000).toFixed(1) + 'K</div>');
            }
            container.innerHTML = cells.join('');
        }

        // === CALCULADORA ===
        function calcularGanancia() {
            const entry = parseFloat(getEl('calc-entry').value) || 0;
            const exit = parseFloat(getEl('calc-exit').value) || 0;
            const amount = parseFloat(getEl('calc-amount').value) || 0;
            const leverage = parseFloat(getEl('calc-leverage').value) || 1;
            if (entry <= 0 || exit <= 0 || amount <= 0) {
                const cr = getEl('calc-result'); if (cr) cr.textContent = '$0.00';
                const croi = getEl('calc-roi'); if (croi) croi.textContent = '0%';
                const cliq = getEl('calc-liquidation'); if (cliq) cliq.textContent = '--';
                return;
            }
            const diff = exit - entry;
            const profit = diff * amount * leverage;
            const roi = (diff / entry) * 100 * leverage;
            const resultEl = getEl('calc-result');
            const roiEl = getEl('calc-roi');
            if (resultEl) {
                resultEl.textContent = (profit >= 0 ? '+' : '') + '$' + Math.abs(profit).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                resultEl.className = 'text-xl font-bold font-mono ' + (profit >= 0 ? 'text-green-400' : 'text-red-400');
            }
            if (roiEl) {
                roiEl.textContent = (roi >= 0 ? '+' : '') + roi.toFixed(2) + '%';
                roiEl.className = 'text-lg font-bold font-mono ' + (roi >= 0 ? 'text-green-400' : 'text-red-400');
            }
            const liqPrice = entry * (1 - (1 / leverage));
            const cliq = getEl('calc-liquidation');
            if (cliq) cliq.textContent = '$' + liqPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function simularPrediccion() {
            const current = parseFloat(getEl('sim-current').value) || 0;
            const target = parseFloat(getEl('sim-target').value) || 0;
            const periodo = getEl('sim-periodo')?.value || '5m';
            if (current <= 0 || target <= 0) {
                const sc = getEl('sim-change'); if (sc) sc.textContent = '0%';
                const sp = getEl('sim-puntos'); if (sp) sp.textContent = '+0 pts';
                const sa = getEl('sim-advice'); if (sa) sa.textContent = 'Ingresa los datos para ver la simulacion';
                return;
            }
            const change = ((target - current) / current) * 100;
            const pts = PUNTOS_POR_PERIODO[periodo] || 1;
            const mult = MULTIPLICADORES[periodo] || 1.0;
            const totalPts = Math.round(pts * mult);
            const changeEl = getEl('sim-change');
            if (changeEl) {
                changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
                changeEl.className = 'text-xl font-bold font-mono ' + (change >= 0 ? 'text-green-400' : 'text-red-400');
            }
            const sp = getEl('sim-puntos');
            if (sp) sp.textContent = '+' + totalPts + ' pts (x' + mult + ')';
            const advice = getEl('sim-advice');
            if (advice) {
                if (Math.abs(change) < 0.5) {
                    advice.textContent = 'El cambio es muy pequeño. Considera un periodo más corto o ajusta tu predicción.';
                    advice.className = 'text-xs text-yellow-400';
                } else if (Math.abs(change) > 20 && (periodo === '5m' || periodo === '15m')) {
                    advice.textContent = 'Cambio muy agresivo para este periodo. Considera un periodo más largo.';
                    advice.className = 'text-xs text-red-400';
                } else if (Math.abs(change) > 50 && periodo !== '1mes') {
                    advice.textContent = 'Cambio extremo. Solo viable en periodos muy largos.';
                    advice.className = 'text-xs text-red-400';
                } else {
                    advice.textContent = 'Predicción viable. ¡Buena suerte!';
                    advice.className = 'text-xs text-green-400';
                }
            }
        }

        async function loadCandleHistory(tf) {
            try {
                const interval = tf === '5s' ? '1s' : tf;
                const limit = 500;
                const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=' + interval + '&limit=' + limit);
                const data = await res.json();

                let candles;
                if (tf === '5s') {
                    candles = agruparVelas5Segundos(data);
                } else {
                    candles = data.map(d => ({
                        time: d[0] / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4]),
                        volume: parseFloat(d[5])
                    }));
                }

                const volumes = candles.map(c => ({
                    time: c.time,
                    value: c.volume || 0,
                    color: c.close >= c.open ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)',
                }));

                candleSeries.setData(candles);
                if (chartTV.volumeSeries) chartTV.volumeSeries.setData(volumes);
                chartTV.timeScale().fitContent();
            } catch (e) { console.error('Error cargando velas:', e); }
        }

        function agruparVelas5Segundos(data) {
            const velas5s = [];
            let grupo = [];
            let currentTime = -1;

            for (const d of data) {
                const time = Math.floor(d[0] / 5000) * 5000;

                if (currentTime === -1) { currentTime = time; }

                if (time !== currentTime && grupo.length > 0) {
                    const primera = grupo[0];
                    const ultima = grupo[grupo.length - 1];
                    const volume = grupo.reduce((sum, g) => sum + parseFloat(g[5]), 0);

                    velas5s.push({
                        time: currentTime / 1000,
                        open: parseFloat(primera[1]),
                        high: Math.max(...grupo.map(g => parseFloat(g[2]))),
                        low: Math.min(...grupo.map(g => parseFloat(g[3]))),
                        close: parseFloat(ultima[4]),
                        volume: volume
                    });

                    grupo = [];
                    currentTime = time;
                }
                grupo.push(d);
            }

            if (grupo.length > 0) {
                const primera = grupo[0];
                const ultima = grupo[grupo.length - 1];
                const volume = grupo.reduce((sum, g) => sum + parseFloat(g[5]), 0);

                velas5s.push({
                    time: currentTime / 1000,
                    open: parseFloat(primera[1]),
                    high: Math.max(...grupo.map(g => parseFloat(g[2]))),
                    low: Math.min(...grupo.map(g => parseFloat(g[3]))),
                    close: parseFloat(ultima[4]),
                    volume: volume
                });
            }

            return velas5s;
        }

        function connectWebSocket() {
            if (state.wsBinance) { state.wsBinance.close(); state.wsBinance = null; }

            const stream = state.currentTF === '5s' ? 'btcusdt@aggTrade' : 'btcusdt@kline_' + state.currentTF;
            state.wsBinance = new WebSocket('wss://stream.binance.com:9443/ws/' + stream);
            let lastCandle = null;

            state.wsBinance.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (state.currentTF === '5s') {
                    const price = parseFloat(msg.p);
                    const time = Math.floor(msg.T / 1000);
                    const groupTime = Math.floor(time / 5) * 5;

                    if (!lastCandle || groupTime > lastCandle.time) {
                        if (lastCandle) {
                            candleSeries.update(lastCandle);
                            if (chartTV.volumeSeries) {
                                chartTV.volumeSeries.update({
                                    time: lastCandle.time,
                                    value: lastCandle.volume || 0,
                                    color: lastCandle.close >= lastCandle.open ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)'
                                });
                            }
                        }
                        lastCandle = {
                            time: groupTime,
                            open: price,
                            high: price,
                            low: price,
                            close: price,
                            volume: parseFloat(msg.q) || 0
                        };
                    } else {
                        lastCandle.high = Math.max(lastCandle.high, price);
                        lastCandle.low = Math.min(lastCandle.low, price);
                        lastCandle.close = price;
                        lastCandle.volume = (lastCandle.volume || 0) + (parseFloat(msg.q) || 0);
                        candleSeries.update(lastCandle);
                    }
                } else {
                    const k = msg.k;
                    const candle = {
                        time: k.t / 1000,
                        open: parseFloat(k.o),
                        high: parseFloat(k.h),
                        low: parseFloat(k.l),
                        close: parseFloat(k.c),
                        volume: parseFloat(k.v)
                    };
                    candleSeries.update(candle);
                    if (chartTV.volumeSeries) {
                        chartTV.volumeSeries.update({
                            time: k.t / 1000,
                            value: parseFloat(k.v),
                            color: candle.close >= candle.open ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)'
                        });
                    }
                    lastCandle = candle;
                }
            };

            state.wsBinance.onerror = (e) => console.log('WS Error:', e);
            state.wsBinance.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        // === BOTS ===
        function selectRandomPersonality() {
            const weights = { aggressive: 0.15, balanced: 0.30, conservative: 0.20, random: 0.10, whale: 0.10, newbie: 0.15 };
            const total = Object.values(weights).reduce((a, b) => a + b, 0);
            let random = Math.random() * total;
            for (const [p, w] of Object.entries(weights)) {
                random -= w;
                if (random <= 0) return p;
            }
            return 'balanced';
        }

        function generateBotName(index, personality) {
            const prefixes = {
                aggressive: ['Alpha', 'Turbo', 'Flash', 'Rocket', 'Blitz', 'Fury', 'Storm'],
                balanced: ['Pro', 'Smart', 'Trade', 'Crypto', 'Wise', 'Edge', 'Nexus'],
                conservative: ['Safe', 'Steady', 'Solid', 'Calm', 'Zen', 'Vault', 'Fortress'],
                random: ['Chaos', 'Wild', 'Lucky', 'Dice', 'Random', 'Mystic', 'Joker'],
                whale: ['Whale', 'Mega', 'Giant', 'Titan', 'King', 'Emperor', 'Legend'],
                newbie: ['New', 'Rookie', 'Noob', 'Starter', 'Trainee', 'Learner', 'Padawan']
            };
            const suffixes = ['Trader', 'Bot', 'AI', 'Predictor', 'Analyzer', 'Master', 'Hunter', 'Scout', 'Ninja', 'Wolf', 'Fox', 'Bear', 'Bull'];
            const prefixList = prefixes[personality] || prefixes.balanced;
            const prefix = prefixList[Math.floor(Math.random() * prefixList.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            return prefix + suffix + '_' + (Math.floor(Math.random() * 999) + 1);
        }

        async function createBotSupabase(config) {
            if (!state.usuarioActual) throw new Error('Inicia sesion primero');
            const personality = config.personality || selectRandomPersonality();
            const personalityConfig = PERSONALITIES[personality];
            const skill = config.skill !== undefined ? config.skill : (personalityConfig.skillRange[0] + Math.random() * (personalityConfig.skillRange[1] - personalityConfig.skillRange[0]));

            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            const uid = generateUUID();
            const username = config.username || generateBotName(state.botManagerState.bots.length, personality);
            const now = new Date().toISOString();

            const userData = {
                uid: uid,
                email: 'bot_' + uid.substr(0, 8) + '@bot.local',
                username: username,
                puntos: 0,
                aciertos: 0,
                total_votos: 0,
                racha: 0,
                mejor_racha: 0,
                logros: [],
                creado: now
            };

            const { error: userError } = await sb.from('usuarios').insert(userData);
            if (userError) throw new Error('Error al crear usuario bot: ' + userError.message);

            const botData = {
                uid: uid,
                username: username,
                personality: personality,
                skill: Math.round(skill * 100) / 100,
                is_active: true,
                puntos: 0,
                aciertos: 0,
                total_votos: 0,
                racha: 0,
                mejor_racha: 0,
                creado: now,
                last_active: now,
                created_by: state.usuarioActual.uid
            };

            const { error: botError } = await sb.from('bots').insert(botData);
            if (botError) {
                await sb.from('usuarios').delete().eq('uid', uid);
                throw new Error('Error al crear bot: ' + botError.message);
            }

            state.botManagerState.lastFetch = 0;
            return { success: true, bot: botData };
        }

        async function getBotsCached(forceRefresh = false) {
            const now = Date.now();
            if (!forceRefresh && state.botManagerState.bots.length > 0 && (now - state.botManagerState.lastFetch) < state.botManagerState.cacheMs) {
                return state.botManagerState.bots;
            }
            if (state.botManagerState.isLoading) return state.botManagerState.bots;
            state.botManagerState.isLoading = true;
            try {
                const { data: bots, error } = await sb
                    .from('bots')
                    .select('*')
                    .order('creado', { ascending: false })
                    .limit(50);

                if (error) throw error;
                state.botManagerState.bots = bots || [];
                state.botManagerState.lastFetch = now;
                return state.botManagerState.bots;
            } catch (e) {
                console.error('Error cargando bots:', e);
                return state.botManagerState.bots;
            } finally {
                state.botManagerState.isLoading = false;
            }
        }

        async function createBots() {
            if (!state.usuarioActual) { mostrarToast('Inicia sesion para crear bots', 'error'); openModal('login'); return; }
            const count = parseInt(getEl('bot-create-count')?.value) || 5;
            const personality = getEl('bot-personality')?.value || 'random';
            const skill = parseFloat(getEl('bot-skill')?.value) || 0.5;
            if (count > 10) { mostrarToast('Máximo 10 bots por lote', 'warn'); return; }
            logBot('Creando ' + count + ' bots...', 'info');
            let created = 0;
            for (let i = 0; i < count; i++) {
                try {
                    const config = { personality: personality === 'random' ? undefined : personality, skill: personality === 'random' ? undefined : skill };
                    const result = await createBotSupabase(config);
                    if (result.success) { created++; logBot('✓ ' + result.bot.username, 'success'); }
                } catch (e) {
                    logBot('✗ ' + e.message, 'error');
                    console.error('Error detallado:', e);
                }
                await new Promise(r => setTimeout(r, 200));
            }
            await refreshBotList(true);
            if (created > 0) mostrarToast(created + ' bots creados', 'success');
        }

            if (elActive) elActive.textContent = active;
            if (elTotal) elTotal.textContent = bots.length;
            if (elWinrate) elWinrate.textContent = avgWinrate + '%';
        }

        // Event listeners para cerrar modal y panel de notificaciones
        document.addEventListener('DOMContentLoaded', () => {
            const modal = getEl('modal-auth');
            if (modal) {
                modal.addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });
            }
            document.addEventListener('click', function(e) {
                const panel = getEl('notif-panel');
                const btn = e.target.closest('button[onclick="toggleNotif()"]');
                if (panel && !panel.classList.contains('hidden') && !panel.contains(e.target) && !btn) panel.classList.add('hidden');
            });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') cerrarModal(); });
        });

        // Exponer funciones globales para los onclick en el HTML
        window.selectPeriodo = selectPeriodo;
        window.votar = votar;
        window.openModal = openModal;
        window.cerrarModal = cerrarModal;
        window.login = login;
        window.register = register;
        window.logout = logout;
        window.switchTab = switchTab;
        window.toggleNotif = toggleNotif;
        window.filtrarMisPreds = filtrarMisPreds;
        window.filtrarGlobal = filtrarGlobal;
        window.cambiarTimeframe = cambiarTimeframe;
        window.calcularGanancia = calcularGanancia;
        window.simularPrediccion = simularPrediccion;
        window.createBots = createBots;
        window.startAllBots = startAllBots;
        window.stopAllBots = stopAllBots;
        window.clearAllBots = clearAllBots;
        window.toggleBot = toggleBot;
        window.refreshBotList = refreshBotList;
        window.clearBotLog = clearBotLog;
    </script>
</head>
<body>
    <!-- El HTML permanece igual, solo se optimiza la carga de scripts y el rendimiento -->
</body>
</html>
