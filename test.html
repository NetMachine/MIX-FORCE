<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTCPredict - Predicciones Futuristas y Avanzadas</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- GSAP para animaciones -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<!-- Lightweight Charts -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.7.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* Personalización adicional */
  @layer utilities {
    .btn {
      @apply px-4 py-2 rounded-lg font-semibold shadow-lg transition-transform;
    }
    .btn-primary {
      @apply bg-primary text-white hover:scale-105 hover:shadow-xl;
    }
    .badge {
      @apply px-2 py-1 rounded-full font-semibold text-xs;
    }
    .toast {
      @apply fixed bottom-4 right-4 bg-gray-800 bg-opacity-80 text-white px-4 py-2 rounded-lg shadow-lg transition-all duration-300;
    }
  }
</style>
</head>
<body class="bg-background text-gray-100 font-sans min-h-screen flex flex-col">

<!-- HEADER -->
<header class="flex justify-between items-center p-4 border-b border-gray-700 sticky top-0 z-50 bg-surface backdrop-blur-lg bg-opacity-80">
  <div class="flex items-center space-x-3">
    <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center rounded-xl shadow-lg shadow-amber-500/20 text-black font-bold text-lg">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <h1 class="text-xl font-bold tracking-tight">BTCPredict <span class="text-xs font-bold bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/20">Beta</span></h1>
  </div>
  <!-- Precio en vivo -->
  <div class="hidden md:flex items-center space-x-2">
    <div class="flex items-center space-x-1">
      <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
      <span class="text-xs font-medium uppercase">BTC/USD</span>
    </div>
    <div class="font-mono text-lg font-bold" id="current-price">--</div>
    <div id="price-trend" class="w-4 h-4"></div>
  </div>
  <!-- Botones de autenticación -->
  <div class="flex gap-2" id="auth-buttons">
    <button class="btn btn-outline" onclick="showModal('login')">Iniciar Sesión</button>
    <button class="btn btn-primary" onclick="showModal('register')">Registrarse</button>
  </div>
  <!-- Menú usuario -->
  <div class="hidden flex-col items-end" id="user-menu">
    <div class="text-sm font-semibold" id="user-name">Usuario</div>
    <div class="text-xs text-gray-400" id="user-tier">Nivel</div>
    <button class="mt-2 btn btn-outline" onclick="logout()">Cerrar Sesión</button>
  </div>
</header>

<!-- Ticker de mercado -->
<div class="overflow-hidden bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border-b border-gray-700 relative">
  <div id="market-ticker" class="flex whitespace-nowrap animate-marquee space-x-8 px-4 py-2 text-sm"></div>
</div>

<!-- Main -->
<main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto space-y-8">

  <!-- Sección: Datos del mercado y gráfico -->
  <section class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 bg-surface rounded-xl shadow-lg p-4">
    <!-- Datos rápidos -->
    <div class="flex flex-col space-y-2">
      <h2 class="text-xl font-semibold mb-2">Resumen del Mercado</h2>
      <div class="flex justify-between"><span>Precio:</span> <span class="font-mono" id="market-price2">--</span></div>
      <div class="flex justify-between"><span>Volumen 24h:</span> <span class="font-mono" id="market-volume">--</span></div>
      <div class="flex justify-between"><span>Máximo 24h:</span> <span class="font-mono" id="market-high">--</span></div>
      <div class="flex justify-between"><span>Mínimo 24h:</span> <span class="font-mono" id="market-low">--</span></div>
    </div>
    <!-- Gráfico -->
    <div class="col-span-2 lg:col-span-2 bg-gray-900 rounded-xl overflow-hidden shadow-md" id="chart-container" style="height:300px;"></div>
  </section>

  <!-- Sección: Predicciones -->
  <section class="bg-surface rounded-xl shadow-lg p-4">
    <h2 class="text-xl font-semibold mb-4">¿Qué crees que hará Bitcoin?</h2>
    <div class="flex gap-4 mb-4 justify-center">
      <button class="btn btn-green" onclick="predict('up')">Subirá</button>
      <button class="btn btn-red" onclick="predict('down')">Bajará</button>
    </div>
    <!-- Confirmación rápida -->
    <div id="prediction-confirm" class="hidden bg-gray-800 p-4 rounded-lg mb-4 flex items-center justify-between border border-gray-600">
      <div class="text-sm">Confirmar predicción: <span id="pred-direction"></span></div>
      <button class="btn btn-primary" onclick="confirmPrediction()">Confirmar</button>
    </div>
  </section>

  <!-- Sección: Feed en vivo -->
  <section class="bg-surface rounded-xl shadow-lg p-4">
    <h2 class="text-xl font-semibold mb-4">Predicciones en Tiempo Real</h2>
    <div id="feed" class="divide-y divide-gray-700 max-h-96 overflow-y-auto space-y-2"></div>
  </section>

  <!-- Sección: Predicción en progreso -->
  <section class="bg-surface rounded-xl shadow-lg p-4" id="prediction-status-section" hidden>
    <h2 class="text-xl font-semibold mb-4">Predicción en Progreso</h2>
    <div class="flex justify-between items-center mb-2">
      <div>Voto:</div>
      <div id="my-vote" class="font-semibold"></div>
    </div>
    <div class="flex justify-between items-center mb-2">
      <div>Tiempo restante:</div>
      <div id="prediction-timer" class="font-mono"></div>
    </div>
    <div class="flex justify-between items-center mb-2">
      <div>Estado:</div>
      <div id="prediction-status" class="font-semibold"></div>
    </div>
  </section>

</main>

<!-- Modales -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
  <div class="bg-gray-900 rounded-xl p-6 w-full max-w-md relative">
    <h3 class="text-xl mb-4" id="modal-title">Título</h3>
    <div id="modal-content"></div>
    <button class="absolute top-2 right-2 text-gray-400 hover:text-white" onclick="closeModal()">×</button>
  </div>
</div>

<!-- Toast notifications -->
<div id="toasts" class="fixed bottom-4 right-4 flex flex-col space-y-2 z-50"></div>

<!-- Scripts -->
<script>
  // Variables globales
  let marketChart = null;
  let predictionProgressInterval = null;
  let currentPredictionId = null;
  let predictions = [];
  let userPrediction = null;

  // Función para cargar datos de mercado simulados
  function loadMarketData() {
    // Datos simulados, reemplazar con fetch real
    const price = (Math.random() * 50000 + 20000);
    const volume = Math.random() * 5000 + 1000;
    const high24 = price * (1 + Math.random() * 0.05);
    const low24 = price * (1 - Math.random() * 0.05);
    document.getElementById('market-price2').textContent = `$${price.toFixed(2)}`;
    document.getElementById('market-volume').textContent = volume.toFixed(0);
    document.getElementById('market-high').textContent = `$${high24.toFixed(2)}`;
    document.getElementById('market-low').textContent = `$${low24.toFixed(2)}`;
    // Actualizar gráfico
    updateChart([price * 0.98, price * 1.02, price * 0.97, price * 1.03]);
  }

  // Función para crear gráfico
  function updateChart(data) {
    if (!marketChart) {
      const container = document.getElementById('chart-container');
      marketChart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 300,
        layout: { backgroundColor: 'transparent', textColor: '#ffffff' },
        grid: { vertLines: { color: '#333' }, horzLines: { color: '#333' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#555' },
        timeScale: { borderColor: '#555' },
      });
      const candlestickSeries = marketChart.addCandlestickSeries({
        upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444'
      });
      // Simulación de datos
      const now = Math.floor(Date.now() / 1000);
      const candles = [];
      for (let i = 0; i < 50; i++) {
        candles.push({
          time: now - (50 - i) * 60,
          open: data[0],
          high: data[1],
          low: data[2],
          close: data[3],
        });
      }
      candlestickSeries.setData(candles);
    } else {
      // Actualizar datos en gráfico real
    }
  }

  // Función para predecir
  function predict(direction) {
    // Guardar predicción
    userPrediction = {
      id: Date.now(),
      direction: direction,
      timestamp: Date.now(),
    };
    document.getElementById('pred-direction').textContent = direction.toUpperCase();
    document.getElementById('prediction-confirm').classList.remove('hidden');
    document.getElementById('prediction-status-section').hidden = false;
    startPredictionProgress();
  }

  // Confirmar predicción
  function confirmPrediction() {
    // Añadir a feed
    addPredictionToFeed(userPrediction);
    showToast(`Predicción registrada: ${userPrediction.direction.toUpperCase()}`, 'success');
    // Reiniciar
    document.getElementById('prediction-confirm').classList.add('hidden');
    clearInterval(predictionProgressInterval);
    document.getElementById('prediction-status-section').hidden = true;
    // Limpiar
    userPrediction = null;
  }

  // Función para añadir predicción al feed
  function addPredictionToFeed(pred) {
    const feed = document.getElementById('feed');
    const item = document.createElement('div');
    item.className = 'p-2 hover:bg-gray-800 transition rounded-lg flex justify-between items-center';
    item.innerHTML = `
      <div>
        <div class="text-sm text-info">${pred.id}</div>
        <div class="${pred.direction==='up'?'text-green-400':'text-red-400'} font-semibold">${pred.direction.toUpperCase()}</div>
      </div>
      <div class="text-xs font-mono">${new Date(pred.timestamp).toLocaleTimeString()}</div>
    `;
    feed.prepend(item);
  }

  // Función para mostrar toast
  function showToast(text, type='info') {
    const toastContainer = document.getElementById('toasts');
    const toast = document.createElement('div');
    toast.className = `toast ${type==='success'?'bg-green-600':'bg-gray-700'}`;
    toast.innerText = text;
    toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 3000);
  }

  // Función para modal
  function showModal(tipo) {
    const modal = document.getElementById('modal');
    const title = modal.querySelector('h3');
    if (tipo==='login') {
      title.innerText='Iniciar Sesión';
      document.getElementById('modal-content').innerHTML = `
        <input class="w-full p-2 mb-2 bg-gray-800 rounded" placeholder="Email" id="email" type="email"/>
        <input class="w-full p-2 mb-2 bg-gray-800 rounded" placeholder="Contraseña" id="password" type="password"/>
        <button class="btn btn-primary w-full mt-2" onclick="fakeLogin()">Entrar</button>
      `;
    } else {
      title.innerText='Registrarse';
      document.getElementById('modal-content').innerHTML = `
        <input class="w-full p-2 mb-2 bg-gray-800 rounded" placeholder="Email" id="reg-email" type="email"/>
        <input class="w-full p-2 mb-2 bg-gray-800 rounded" placeholder="Contraseña" id="reg-password" type="password"/>
        <button class="btn btn-primary w-full mt-2" onclick="fakeRegister()">Crear</button>
      `;
    }
    modal.classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  // Funciones fake login/register
  function fakeLogin() {
    showToast('Sesión iniciada', 'success');
    document.getElementById('auth-buttons').classList.add('hidden');
    document.getElementById('user-menu').classList.remove('hidden');
    document.getElementById('user-name').innerText='UsuarioDemo';
    closeModal();
  }
  function fakeRegister() {
    showToast('Registrado! Inicia sesión', 'success');
    closeModal();
  }

  // Funciones para predicciones en progreso
  function startPredictionProgress() {
    let progress = 0;
    clearInterval(predictionProgressInterval);
    predictionProgressInterval = setInterval(() => {
      progress += Math.random()*5;
      if (progress>=100) {
        progress=100;
        clearInterval(predictionProgressInterval);
      }
      document.getElementById('prediction-timer').innerText=progress.toFixed(0)+'%';
    }, 300);
  }

  // Función para logout
  function logout() {
    showToast('Sesión cerrada', 'info');
    document.getElementById('auth-buttons').classList.remove('hidden');
    document.getElementById('user-menu').classList.add('hidden');
  }

  // Inicialización
  loadMarketData();
  setInterval(loadMarketData, 15000);
</script>
</body>
</html>
