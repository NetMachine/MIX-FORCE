<!-- TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-40">
    <span id="toast-text"></span>

<script>
// ==============================================
// VARIABLES
// ==============================================
let usuarioActual = null;
let periodoSeleccionado = null;
let precioBTC = 0;
const DURACIONES = {
    '5m': 5 * 60 * 1000, '15m': 15 * 60 * 1000, '30m': 30 * 60 * 1000,
    '1h': 60 * 60 * 1000, '4h': 4 * 60 * 60 * 1000, '24h': 24 * 60 * 60 * 1000,
    '1sem': 7 * 24 * 60 * 60 * 1000, '1mes': 30 * 24 * 60 * 60 * 1000
};
const TIERS = [
    { nombre: 'Bronce', min: 0, clase: 'bronze' },
    { nombre: 'Plata', min: 50, clase: 'silver' },
    { nombre: 'Oro', min: 200, clase: 'gold' },
    { nombre: 'Platino', min: 500, clase: 'platinum' },
    { nombre: 'Maestro', min: 1000, clase: 'master' }
];

// ==============================================
// INICIO
// ==============================================
document.addEventListener('DOMContentLoaded', () => {
    cargarPrecioBTC();
    setInterval(cargarPrecioBTC, 30000);
    verificarSesion();
});

// ==============================================
// PRECIO DE BITCOIN
// ==============================================
async function cargarPrecioBTC() {
    try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true');
        const data = await res.json();
        precioBTC = data.bitcoin.usd;
        const cambio = data.bitcoin.usd_24h_change.toFixed(2);
        const esPositivo = cambio >= 0;
        const cambioTxt = `${esPositivo ? '+' : ''}${cambio}%`;
        const clase = esPositivo ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400';
        
        document.getElementById('price-value').textContent = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD',minimumFractionDigits:0}).format(precioBTC);
        document.getElementById('price-value-movil').textContent = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD',minimumFractionDigits:0}).format(precioBTC);
        
        document.getElementById('price-change').textContent = cambioTxt;
        document.getElementById('price-change').className = `text-sm px-2 py-0.5 rounded-full ${clase}`;
        document.getElementById('price-change-movil').textContent = cambioTxt;
        document.getElementById('price-change-movil').className = `text-sm px-2 py-0.5 rounded-full ${clase}`;
    } catch (e) { console.log('Error precio'); }
}

// ==============================================
// AUTENTICACIÓN FIREBASE
// ==============================================
function verificarSesion() {
    auth.onAuthStateChanged(async (user) => {
        if (user) await cargarUsuario(user);
        else { usuarioActual = null; actualizarUI(); }
    });
}

async function cargarUsuario(user) {
    const doc = await db.collection('usuarios').doc(user.uid).get();
    if (!doc.exists) {
        const username = user.displayName || user.email.split('@')[0];
        await db.collection('usuarios').doc(user.uid).set({
            email: user.email,
            username: username,
            puntos: 0,
            aciertos: 0,
            total_votos: 0,
            creado: new Date()
        });
        usuarioActual = { uid: user.uid, email: user.email, username, puntos: 0, aciertos: 0, total_votos: 0 };
    } else {
        usuarioActual = { uid: user.uid, ...doc.data() };
    }
    actualizarUI();
    cargarMisPredicciones();
    cargarRanking();
}

async function register() {
    const email = document.getElementById('email-reg').value.trim();
    const pass = document.getElementById('pass-reg').value;
    const username = document.getElementById('username').value.trim();
    
    if (!email || !pass || !username) return mostrarToast('Completa todos los campos', 'error');
    if (pass.length < 6) return mostrarToast('Contraseña mínimo 6 caracteres', 'error');
    
    try {
        const { user } = await auth.createUserWithEmailAndPassword(email, pass);
        await user.updateProfile({ displayName: username });
        mostrarToast('✅ Cuenta creada con éxito!');
        cerrarModal();
    } catch (e) {
        mostrarToast('❌ ' + e.message, 'error');
    }
}

async function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    
    try {
        await auth.signInWithEmailAndPassword(email, pass);
        mostrarToast('¡Bienvenido! 🎉');
        cerrarModal();
    } catch (e) {
        mostrarToast('❌ ' + e.message, 'error');
    }
}

async function logout() {
    await auth.signOut();
    usuarioActual = null;
    actualizarUI();
    mostrarToast('Sesión cerrada');
}

function actualizarUI() {
    const authBtns = document.getElementById('auth-buttons');
    const userMenu = document.getElementById('user-menu');
    
    if (usuarioActual) {
        authBtns.classList.add('hidden');
        userMenu.classList.remove('hidden');
        userMenu.classList.add('flex');
        document.getElementById('user-name').textContent = usuarioActual.username;
        const tier = getTier(usuarioActual.puntos || 0);
        document.getElementById('user-tier').textContent = tier.nombre;
    } else {
        authBtns.classList.remove('hidden');
        userMenu.classList.add('hidden');
        userMenu.classList.remove('flex');
    }
}

// ==============================================
// VOTACIÓN
// ==============================================
function selectPeriodo(periodo, btn) {
    periodoSeleccionado = periodo;
    document.querySelectorAll('.periodo-btn').forEach(b => b.classList.remove('border-amber-400', 'bg-amber-500/10'));
    btn.classList.add('border-amber-400', 'bg-amber-500/10');
    
    document.getElementById('botones-voto').classList.remove('hidden');
    document.getElementById('periodo-activo').classList.remove('hidden');
    document.getElementById('periodo-activo').textContent = `Periodo: ${periodo}`;
    document.getElementById('instruccion').classList.add('hidden');
}

async function votar(direccion) {
    if (!usuarioActual) {
        openModal('login');
        return mostrarToast('Inicia sesión para votar', 'error');
    }
    if (!periodoSeleccionado) return mostrarToast('Selecciona un periodo', 'error');
    
    const ahora = new Date();
    const cierre = new Date(ahora.getTime() + DURACIONES[periodoSeleccionado]);
    
    // Verificar voto duplicado
    const snap = await db.collection('predicciones')
        .where('usuarioId', '==', usuarioActual.uid)
        .where('periodo', '==', periodoSeleccionado)
        .where('estado', '==', 'activo')
        .get();
    
    if (!snap.empty) return mostrarToast('⚠️ Ya votaste en este periodo', 'error');
    
    // Guardar predicción
    await db.collection('predicciones').add({
        usuarioId: usuarioActual.uid,
        periodo: periodoSeleccionado,
        voto: direccion,
        precioInicial: precioBTC,
        cierre: cierre,
        estado: 'activo',
        creado: new Date()
    });
    
    mostrarToast(`✅ Voto registrado: ${direccion.toUpperCase()}`);
    document.getElementById('mensaje').textContent = `✅ Voto: ${direccion.toUpperCase()}`;
    
    // Programar verificación
    setTimeout(() => verificarResultado(), DURACIONES[periodoSeleccionado]);
    
    cargarMisPredicciones();
}

async function verificarResultado() {
    try {
        const snap = await db.collection('predicciones')
            .where('estado', '==', 'activo')
            .get();
        
        for (const doc of snap.docs) {
            const pred = doc.data();
            if (new Date(pred.cierre) > new Date()) continue;
            
            // Obtener precio final
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
            const data = await res.json();
            const precioFinal = data.bitcoin.usd;
            
            const subio = precioFinal > pred.precioInicial;
            const acierto = (pred.voto === 'sube' && subio) || (pred.voto === 'baja' && !subio);
            
            // Actualizar predicción
            await db.collection('predicciones').doc(doc.id).update({
                precioFinal,
                estado: 'cerrado',
                resultado: acierto ? 'acierto' : 'fallo'
            });
            
            // Actualizar usuario
            const userRef = db.collection('usuarios').doc(pred.usuarioId);
            if (acierto) {
                await userRef.update({
                    puntos: firebase.firestore.FieldValue.increment(1),
                    aciertos: firebase.firestore.FieldValue.increment(1),
                    total_votos: firebase.firestore.FieldValue.increment(1)
                });
                if (usuarioActual?.uid === pred.usuarioId) {
                    usuarioActual.puntos++;
                    usuarioActual.aciertos++;
                    usuarioActual.total_votos++;
                    actualizarUI();
                }
            } else {
                await userRef.update({
                    total_votos: firebase.firestore.FieldValue.increment(1)
                });
                if (usuarioActual?.uid === pred.usuarioId) usuarioActual.total_votos++;
            }
        }
        cargarMisPredicciones();
        cargarRanking();
    } catch (e) { console.log('Error verificar:', e); }
}

async function cargarMisPredicciones() {
    if (!usuarioActual) return;
    const snap = await db.collection('predicciones')
        .where('usuarioId', '==', usuarioActual.uid)
        .orderBy('creado', 'desc')
        .limit(10)
        .get();
    
    const contenedor = document.getElementById('mis-predicciones');
    if (snap.empty) {
        contenedor.innerHTML = '<p class="text-gray-500 text-center py-4">No tienes predicciones</p>';
        return;
    }
    
    contenedor.innerHTML = snap.docs.map(d => {
        const p = d.data();
        const esActivo = p.estado === 'activo';
        const estadoClase = esActivo ? 'text-amber-400' : (p.resultado === 'acierto' ? 'text-green-400' : 'text-red-400');
        const estadoTxt = esActivo ? '⏳ Pendiente' : (p.resultado === 'acierto' ? '✅ Acertado' : '❌ Fallado');
        return `
            <div class="card-glass rounded-xl p-4 flex justify-between items-center">
                <div>
                    <span class="font-bold">${p.periodo}</span>
                    <span class="ml-2 ${p.voto === 'sube' ? 'text-green-400' : 'text-red-400'}">
                        ${p.voto === 'sube' ? '🔼 SUBE' : '🔽 BAJA'}
                    </span>
                </div>
                <div class="text-right">
                    <div class="${estadoClase} text-sm font-semibold">${estadoTxt}</div>
                </div>
            </div>
        `;
    }).join('');
}

// ==============================================
// RANKING
// ==============================================
function getTier(puntos) {
    let t = TIERS[0];
    for (const x of TIERS) if (puntos >= x.min) t = x;
    return t;
}

async function cargarRanking() {
    const snap = await db.collection('usuarios')
        .orderBy('puntos', 'desc')
        .limit(50)
        .get();
    
    const tbody = document.getElementById('ranking-body');
    tbody.innerHTML = snap.docs.map((doc, i) => {
        const u = { uid: doc.id, ...doc.data() };
        const tier = getTier(u.puntos || 0);
        const winrate = u.total_votos ? ((u.aciertos / u.total_votos) * 100).toFixed(1) : 0;
        const esYo = usuarioActual && u.uid === usuarioActual.uid;
        return `
            <tr class="${esYo ? 'bg-amber-500/10' : ''} border-t border-slate-700/50">
                <td class="py-3 px-4 font-bold">${i + 1}</td>
                <td class="py-3 px-4">
                    <span class="font-semibold">${u.username}</span>
                    ${esYo ? '<span class="ml-2 text-xs text-amber-400">(Tú)</span>' : ''}
                </td>
                <td class="py-3 px-4 text-center">
                    <span class="px-2 py-1 rounded-full text-xs font-bold ${tier.clase}">${tier.nombre}</span>
                </td>
                <td class="py-3 px-4 text-center font-bold text-amber-400">${u.puntos || 0}</td>
                <td class="py-3 px-4 text-center">${winrate}%</td>
            </tr>
        `;
    }).join('');
}

// ==============================================
// FUNCIONES AUXILIARES
// ==============================================
function switchTab(tab) {
    document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    
    document.querySelectorAll('[onclick^="switchTab"]').forEach(b => {
        b.classList.remove('tab-active');
        b.classList.add('text-gray-400');
    });
    event.target.classList.add('tab-active');
    event.target.classList.remove('text-gray-400');
    
    if (tab === 'ranking') cargarRanking();
    if (tab === 'predict' && usuarioActual) cargarMisPredicciones();
}

function openModal(tipo) {
    document.getElementById('modal-auth').classList.remove('hidden');
    document.getElementById('modal-auth').classList.add('flex');
    if (tipo === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('modal-titulo').textContent = 'Iniciar Sesión';
    } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('modal-titulo').textContent = 'Crear Cuenta';
    }
}

function cerrarModal() {
    document.getElementById('modal-auth').classList.add('hidden');
    document.getElementById('modal-auth').classList.remove('flex');
}

function mostrarToast(mensaje, tipo = 'success') {
    const toast = document.getElementById('toast');
    document.getElementById('toast-text').textContent = mensaje;
    toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 ${tipo === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-40`;
    toast.style.transform = 'translate(-50%, 0)';
    toast.style.opacity = '1';
    setTimeout(() => {
        toast.style.transform = 'translate(-50%, 80px)';
        toast.style.opacity = '0';
    }, 4000);
}

document.getElementById('modal-auth').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-auth')) cerrarModal();
});
</script>
